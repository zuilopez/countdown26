<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header (mode · title+clock · red menu tab), then Old (3 frames) or New (4 lanes + archive) */
:root{
  --bg:#000000; --ac:#22d3ee; --tab:#e11d2e;
  --tx:#f2f2f4; --mut:#8b8f98; --ln:rgba(255,255,255,.12); --pn:#0b0c0f; --pn2:#121318;
  --p0:#f0705a; --p1:#f0b04a; --p2:#6fb0e8; --p3:#a7adb0; --wt:#e6d25a; --ok:#7cc98c;
  --hh:56px; --sans:"Be Vietnam Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  background:var(--bg);border-bottom:1px solid var(--ln);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px))}
.mode{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;flex:none}
.mode button{background:transparent;border:0;padding:7px 12px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}
.mode button[aria-pressed=true]{background:var(--ac);color:#05080a}
.ttl{min-width:0;display:flex;align-items:baseline;gap:12px;white-space:nowrap;overflow:hidden}
.ttl h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em;flex:none}
.clock{font-family:var(--mono);font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
body[data-align=center] .ttl{justify-content:center}
body[data-align=right] .ttl{justify-content:flex-end}
.tabwrap{position:relative;height:var(--hh);align-self:end;padding-right:env(safe-area-inset-right,0px)}
#tab{display:block;width:14px;height:100%;border:0;background:var(--tab);cursor:pointer;padding:0}
#tab:hover,#tab[aria-expanded=true]{width:18px}
#menu{position:absolute;right:0;top:100%;width:min(320px,calc(100vw - 32px));background:var(--pn2);border:1px solid var(--ln);border-top:2px solid var(--tab);
  padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
#menu h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mrow label{font-size:13px}
.mrow input[type=color]{width:42px;height:28px;border:1px solid var(--ln);background:transparent;padding:0;border-radius:6px;cursor:pointer}
.seg{display:flex;border:1px solid var(--ln);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--tx);color:#000}
.chk{display:flex;gap:14px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.btn{background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* page */
main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-width:1600px;margin:0 auto}
.stats{display:flex;flex-wrap:wrap;gap:8px}
body[data-align=center] .stats{justify-content:center}
body[data-align=right] .stats{justify-content:flex-end}
.stat{font:12px var(--mono);padding:5px 9px;border:1px solid var(--ln);border-radius:6px;font-variant-numeric:tabular-nums}
.stat.warn{border-color:var(--p0);color:var(--p0)}
.msg{padding:12px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--pn)}
.login{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login input{background:#000;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--pn2);border:1px solid var(--ln);
  padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100vw - 32px)}

/* panels (mica fx = translucent + blur) */
.pnl{background:var(--pn);border:1px solid var(--ln);border-radius:12px;min-width:0;display:flex;flex-direction:column}
body.mica .pnl{background:rgba(255,255,255,.045);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ph{padding:10px 12px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph b{font-size:13px}.ph i{display:block;font-style:normal;font-size:11.5px;color:var(--mut)}.ph .n{font:12px var(--mono);color:var(--mut)}
.list{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:64px}
.empty{font-size:12px;color:var(--mut);text-align:center;padding:12px 4px}

/* waiting strip */
.wait{display:flex;gap:8px;overflow-x:auto;padding:10px}
.wait .card{min-width:240px;max-width:300px}

/* cards */
.card{border:1px solid var(--ln);border-left:3px solid var(--lc,var(--p3));background:rgba(0,0,0,.35);padding:9px 10px;display:flex;flex-direction:column;gap:6px;
  transition:transform .15s ease}
.card[draggable=true]{cursor:grab}.card.drag{opacity:.4}
.card .t{font-weight:600;overflow-wrap:anywhere}
.card.done .t{text-decoration:line-through;color:var(--mut)}
.th{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border:1px solid var(--ln)}
.meta{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:11.5px var(--mono);padding:2px 6px;border-radius:4px;border:1px solid var(--ln);color:var(--mut);white-space:nowrap}
.chip.late{border-color:var(--p0);color:var(--p0)}.chip.soon{border-color:var(--p1);color:var(--p1)}.chip.rem{border-color:var(--wt);color:var(--wt)}
.note{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl select,.ctl button{background:#000;border:1px solid var(--ln);border-radius:6px;padding:3px 6px;font-size:12px;cursor:pointer}
.ctl a{font-size:12px;color:var(--ac);margin-left:auto}

/* NEW: 4 lanes + archive */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:12px;align-items:start}
.lane.over{outline:2px dashed var(--ac);outline-offset:-4px}
.arch{width:56px}.arch .list,.arch .ph i{display:none}
.arch .ph{writing-mode:vertical-rl;transform:rotate(180deg);border:0;padding:12px 8px;cursor:pointer;justify-content:flex-start}
.arch.open{width:auto;min-width:240px}.arch.open .list{display:flex}.arch.open .ph i{display:block}
.arch.open .ph{writing-mode:horizontal-tb;transform:none;border-bottom:1px solid var(--ln)}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.arch,.arch.open{width:auto;grid-column:1/-1}
  .arch .ph{writing-mode:horizontal-tb;transform:none}}
@media (max-width:640px){.board{grid-template-columns:1fr}}

/* OLD: 3 frames */
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.frames{grid-template-columns:1fr}}
.big{padding:14px 12px 4px;display:flex;flex-direction:column;gap:2px}
body[data-align=center] .big{align-items:center;text-align:center}
body[data-align=right] .big{align-items:flex-end;text-align:right}
.big .cd{font:600 clamp(26px,4vw,40px)/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big .cdl{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}

/* scan fx */
#scan{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;display:none}
body.scan #scan{display:block}
#scan::after{content:"";position:absolute;left:0;right:0;height:140px;top:-140px;
  background:linear-gradient(transparent,color-mix(in srgb,var(--ac) 18%,transparent),transparent);animation:sweep 9s linear infinite}
@keyframes sweep{to{top:100%}}
@media (prefers-reduced-motion:reduce){#scan::after{animation:none;display:none}.card{transition:none}}
@media (max-width:520px){.clock{font-size:11.5px}.ttl{gap:8px}.ttl h1{font-size:16px}.mode button{padding:7px 9px}}
@media (max-width:380px){.ttl h1{display:none}}
</style>
</head>
<body data-align="left">
<div id="scan" aria-hidden="true"></div>

<header>
  <div class="mode" role="group" aria-label="Giao diện">
    <button type="button" data-mode="old" aria-pressed="false">Old</button>
    <button type="button" data-mode="new" aria-pressed="true">New</button>
  </div>
  <div class="ttl"><h1>countdown</h1><span class="clock" id="clock"></span></div>
  <div class="tabwrap" id="tabwrap">
    <button id="tab" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="menu"></button>
    <div id="menu" hidden>
      <h2>Giao diện</h2>
      <div class="mrow"><label>Kiểu</label><div class="seg" id="m-mode"><button type="button" data-v="old">Old</button><button type="button" data-v="new">New</button></div></div>
      <div class="mrow"><label>Căn lề</label><div class="seg" id="m-align"><button type="button" data-v="left">Trái</button><button type="button" data-v="center">Giữa</button><button type="button" data-v="right">Phải</button></div></div>
      <h2>Màu</h2>
      <div class="mrow"><label for="c-bg">Nền</label><input type="color" id="c-bg"></div>
      <div class="mrow"><label for="c-ac">Màu nhấn</label><input type="color" id="c-ac"></div>
      <div class="mrow"><label for="c-tab">Nút menu</label><input type="color" id="c-tab"></div>
      <h2>Hiệu ứng</h2>
      <div class="chk"><label><input type="checkbox" id="fx-mica"> Mica</label><label><input type="checkbox" id="fx-scan"> Scan</label><label><input type="checkbox" id="fx-tilt"> Tilt</label></div>
      <div class="btns"><button class="btn" type="button" id="b-re">Làm mới dữ liệu</button><button class="btn" type="button" id="b-reset">Mặc định</button><button class="btn" type="button" id="b-out">Khoá</button></div>
    </div>
  </div>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div id="view"></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const LV={P0:'P0 · Khẩn',P1:'P1 · Quan trọng',P2:'P2 · Kế hoạch',P3:'P3 · Khi rảnh',W:'Chờ',D:'Xong'};
  const COL={[LV.P0]:'var(--p0)',[LV.P1]:'var(--p1)',[LV.P2]:'var(--p2)',[LV.P3]:'var(--p3)',[LV.W]:'var(--wt)',[LV.D]:'var(--ok)'};
  const SHORT={[LV.P0]:'P0',[LV.P1]:'P1',[LV.P2]:'P2',[LV.P3]:'P3',[LV.W]:'Chờ',[LV.D]:'Xong'};
  const REP=['Một lần','Hằng ngày','Hằng tuần','Hằng tháng'];
  const TYPE_RANK={'Khách':0,'Tiền':1,'Content':2,'Học':3,'Cá nhân':4};
  const DEF={mode:'new',align:'left',bg:'#000000',ac:'#22d3ee',tab:'#e11d2e',mica:true,scan:false,tilt:false};
  const UK='ctd_ui_v2',PK='ctd_dwork_pass';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
  let ui=Object.assign({},DEF,JSON.parse(ls.get(UK)||'{}'));
  let pass=ls.get(PK)||'', tasks=[], err='', loading=false, archOpen=false;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- time ---------- */
  const DOW=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  const p2=n=>String(n).padStart(2,'0');
  function tick(){
    const d=new Date();
    $('#clock').textContent=`${DOW[d.getDay()]}, ${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} · ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
    $$('[data-cd]').forEach(el=>{el.textContent=fmtCd(el.dataset.cd)});
  }
  const day0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
  const left=s=>s?Math.round((new Date(s.slice(0,10)+'T00:00:00')-day0())/864e5):null;
  const dm=s=>{const d=new Date(s.slice(0,10)+'T00:00:00');return d.getDate()+'/'+(d.getMonth()+1)};
  function fmtCd(s){
    const end=new Date(s.slice(0,10)+'T23:59:59'), ms=end-new Date();
    if(ms<0){const n=-left(s);return n<=0?'hôm nay':'quá '+n+' ngày'}
    const t=Math.floor(ms/1000),dd=Math.floor(t/86400),hh=Math.floor(t%86400/3600),mm=Math.floor(t%3600/60),ss=t%60;
    return (dd?dd+'d ':'')+p2(hh)+':'+p2(mm)+':'+p2(ss);
  }
  const dueOf=t=>t.deadline||(t.level!==LV.D?t.remind:'')||'';

  /* ---------- priority order inside a column ---------- */
  function rank(t){
    const n=left(t.deadline), r=left(t.remind);
    const urgent=(n!==null&&n<0)||(r!==null&&r<=0)?0:1;
    return [urgent, n===null?9999:n, TYPE_RANK[t.type]??9, t.title.toLowerCase()];
  }
  function cmp(a,b){const x=rank(a),y=rank(b);for(let i=0;i<x.length;i++){if(x[i]<y[i])return -1;if(x[i]>y[i])return 1}return 0}

  /* ---------- settings ---------- */
  function applyUi(){
    const r=document.documentElement.style;
    r.setProperty('--bg',ui.bg);r.setProperty('--ac',ui.ac);r.setProperty('--tab',ui.tab);
    document.body.dataset.align=ui.align;
    document.body.classList.toggle('mica',!!ui.mica);document.body.classList.toggle('scan',!!ui.scan);
    $$('.mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===ui.mode));
    $$('#m-mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ui.mode));
    $$('#m-align button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ui.align));
    $('#c-bg').value=ui.bg;$('#c-ac').value=ui.ac;$('#c-tab').value=ui.tab;
    $('#fx-mica').checked=!!ui.mica;$('#fx-scan').checked=!!ui.scan;$('#fx-tilt').checked=!!ui.tilt;
  }
  function save(){ls.set(UK,JSON.stringify(ui));applyUi()}
  function setMode(m){ui.mode=m;save();render()}
  $$('.mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  $$('#m-mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.v));
  $$('#m-align button').forEach(b=>b.onclick=()=>{ui.align=b.dataset.v;save()});
  $('#c-bg').oninput=e=>{ui.bg=e.target.value;save()};
  $('#c-ac').oninput=e=>{ui.ac=e.target.value;save()};
  $('#c-tab').oninput=e=>{ui.tab=e.target.value;save()};
  $('#fx-mica').onchange=e=>{ui.mica=e.target.checked;save()};
  $('#fx-scan').onchange=e=>{ui.scan=e.target.checked;save()};
  $('#fx-tilt').onchange=e=>{ui.tilt=e.target.checked;save()};
  $('#b-reset').onclick=()=>{ui=Object.assign({},DEF);save();render()};
  $('#b-re').onclick=()=>{load(true)};
  $('#b-out').onclick=()=>{pass='';ls.set(PK,null);tasks=[];closeMenu();render()};

  /* ---------- red tab menu: hover to open (tap on touch) ---------- */
  const wrap=$('#tabwrap'),tab=$('#tab'),menu=$('#menu');let hideT;
  function openMenu(){clearTimeout(hideT);menu.hidden=false;tab.setAttribute('aria-expanded','true')}
  function closeMenu(){menu.hidden=true;tab.setAttribute('aria-expanded','false')}
  const canHover=matchMedia('(hover:hover)').matches;
  if(canHover){wrap.addEventListener('mouseenter',openMenu);wrap.addEventListener('mouseleave',()=>{hideT=setTimeout(closeMenu,250)})}
  tab.addEventListener('click',()=>menu.hidden?openMenu():closeMenu());
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))closeMenu()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});

  /* ---------- data ---------- */
  function api(method,body){
    return fetch('/api/dwork',{method,headers:{'x-ctd-pass':pass,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
      .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.message||('Lỗi '+r.status)),{code:j.error});return j});
  }
  function load(force){
    if(!pass){render();return}
    if(loading)return;loading=true;if(force)toast('Đang tải từ Notion…');
    api('GET').then(j=>{tasks=j.tasks;err='';loading=false;render();if(force)toast('Đã cập nhật')})
      .catch(e=>{loading=false;if(e.code==='auth'){pass='';ls.set(PK,null);err='Sai mật khẩu.'}else err=e.message;render()});
  }
  function patch(t,body,optimistic){
    const before=Object.assign({},t);Object.assign(t,optimistic||{});render();
    return api('PATCH',Object.assign({id:t.id},body)).then(j=>{Object.assign(t,j.task);render();
      if(j.rescheduled)toast(`Việc lặp: hẹn lại ${dm(j.task.remind)} (${j.task.repeat})`)})
      .catch(e=>{Object.assign(t,before);render();toast('Không lưu được: '+e.message)});
  }
  function move(id,level){
    const t=tasks.find(x=>x.id===id);if(!t||t.level===level)return;
    patch(t,{level,prevLevel:t.level,currentRepeat:t.repeat},{level});
  }
  function setRepeat(id,repeat){const t=tasks.find(x=>x.id===id);if(t&&t.repeat!==repeat)patch(t,{repeat},{repeat})}

  let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}

  /* ---------- render ---------- */
  function card(t,drag){
    const n=left(t.deadline),r=left(t.remind),done=t.level===LV.D;
    let due='';
    if(n!==null)due=n<0?`<span class="chip late">quá ${-n} ngày · ${dm(t.deadline)}</span>`:n===0?`<span class="chip late">hôm nay</span>`:n<=7?`<span class="chip soon">còn ${n} ngày · ${dm(t.deadline)}</span>`:`<span class="chip">${dm(t.deadline)}</span>`;
    const rem=r!==null&&!done?`<span class="chip rem">🔁 ${r<=0?'nhắc hôm nay':'nhắc '+dm(t.remind)}</span>`:'';
    const lvSel=Object.values(LV).map(l=>`<option value="${l}"${l===t.level?' selected':''}>${SHORT[l]}</option>`).join('');
    const rpSel=REP.map(x=>`<option${x===(t.repeat||'Một lần')?' selected':''}>${x}</option>`).join('');
    return `<article class="card${done?' done':''} tilt" ${drag?'draggable="true"':''} data-id="${t.id}" style="--lc:${COL[t.level]||'var(--p3)'}">
      ${/^https?:\/\//.test(t.thumb)?`<img class="th" src="${esc(t.thumb)}" alt="" loading="lazy" draggable="false">`:''}
      <div class="t">${esc(t.title)}</div>
      <div class="meta">${t.project?`<span class="chip">${esc(t.project)}</span>`:''}${t.type?`<span class="chip">${esc(t.type)}</span>`:''}${t.size?`<span class="chip">${esc(t.size)}</span>`:''}${due}${rem}</div>
      ${t.note?`<div class="note">${esc(t.note)}</div>`:''}
      <div class="ctl"><select data-mv="${t.id}" aria-label="Mức">${lvSel}</select>
        <select data-rp="${t.id}" aria-label="Lặp lại">${rpSel}</select>
        ${done?'':`<button type="button" data-done="${t.id}">✓ Xong</button>`}
        <a href="${esc(t.url)}" target="_blank" rel="noopener">Notion</a></div></article>`;
  }
  function lane(level,label,rule,list,cls){
    return `<section class="pnl lane ${cls||''}" data-l="${level}"><div class="ph"><b style="color:${COL[level]}">${label}<i>${rule}</i></b><span class="n">${list.length}</span></div>
      <div class="list">${list.length?list.map(t=>card(t,true)).join(''):'<div class="empty">Kéo thẻ vào đây</div>'}</div></section>`;
  }
  function waitStrip(){
    const w=tasks.filter(t=>t.level===LV.W).sort(cmp);
    if(!w.length)return '';
    return `<section class="pnl lane" data-l="${LV.W}"><div class="ph"><b style="color:var(--wt)">Đang chờ<i>Đã làm phần mình · chờ phản hồi / hàng về</i></b><span class="n">${w.length}</span></div>
      <div class="wait">${w.map(t=>card(t,true)).join('')}</div></section>`;
  }
  function viewNew(){
    const by=l=>tasks.filter(t=>t.level===l).sort(cmp);
    const done=by(LV.D);
    return waitStrip()+`<div class="board">
      ${lane(LV.P0,'P0 · Khẩn','Tiền/khách ≤48h, quá hạn',by(LV.P0))}
      ${lane(LV.P1,'P1 · Quan trọng','Deadline ≤7 ngày',by(LV.P1))}
      ${lane(LV.P2,'P2 · Kế hoạch','Mốc >7 ngày',by(LV.P2))}
      ${lane(LV.P3,'P3 · Khi rảnh','Chưa có mốc',by(LV.P3))}
      <section class="pnl lane arch${archOpen?' open':''}" data-l="${LV.D}"><div class="ph" id="arch-h" role="button" tabindex="0" aria-expanded="${archOpen}"><b style="color:var(--ok)">Xong · lưu trữ<i>Bấm để thu gọn</i></b><span class="n">${done.length}</span></div>
        <div class="list">${done.length?done.map(t=>card(t,true)).join(''):'<div class="empty">Chưa có</div>'}</div></section>
    </div>`;
  }
  function frame(title,sub,list){
    const next=list.filter(t=>dueOf(t)).sort((a,b)=>dueOf(a)<dueOf(b)?-1:1)[0];
    return `<section class="pnl tilt"><div class="big">
        <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)">${title}</div>
        <div class="cd" ${next?`data-cd="${dueOf(next)}"`:''}>${next?fmtCd(dueOf(next)):'—'}</div>
        <div class="cdl">${next?esc(next.title):sub}</div></div>
      <div class="list">${list.length?list.map(t=>card(t,false)).join(''):'<div class="empty">Không có việc</div>'}</div></section>`;
  }
  function viewOld(){
    const f=ls_=>tasks.filter(t=>ls_.includes(t.level)).sort(cmp);
    return `<div class="frames">
      ${frame('Ngắn hạn','P0 · P1 · đang chờ',f([LV.P0,LV.P1,LV.W]))}
      ${frame('Trung hạn','P2 · có mốc > 7 ngày',f([LV.P2]))}
      ${frame('Dài hạn','P3 · chưa có mốc',f([LV.P3]))}
    </div>`;
  }
  function stats(){
    const open=tasks.filter(t=>t.level!==LV.D&&t.level!==LV.W);
    const late=open.filter(t=>left(t.deadline)!==null&&left(t.deadline)<0).length;
    const rem=tasks.filter(t=>t.level!==LV.D&&left(t.remind)!==null&&left(t.remind)<=0).length;
    const act=new Set(tasks.filter(t=>t.level===LV.P0||t.level===LV.P1).map(t=>t.project||'—')).size;
    $('#stats').innerHTML=pass&&tasks.length?`<span class="stat">${open.length} việc mở</span><span class="stat${late?' warn':''}">${late} quá hạn</span><span class="stat${rem?' warn':''}">${rem} nhắc hôm nay</span><span class="stat${act>3?' warn':''}">${act}/3 dự án chạy</span>`:'';
  }
  function render(){
    stats();
    const v=$('#view');
    if(!pass){v.innerHTML=`<div class="msg"><form class="login" id="lf"><label for="pw">Mật khẩu</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn" type="submit">Mở</button></form>${err?`<div style="margin-top:8px;color:var(--p0);font-size:13px">${esc(err)}</div>`:''}</div>`;return}
    if(err&&!tasks.length){v.innerHTML=`<div class="msg">${esc(err)}</div>`;return}
    if(!tasks.length){v.innerHTML=`<div class="msg">Đang tải từ Notion…</div>`;return}
    v.innerHTML=ui.mode==='old'?viewOld():viewNew();
  }

  /* ---------- events ---------- */
  const view=$('#view');
  view.addEventListener('submit',e=>{if(e.target.id!=='lf')return;e.preventDefault();pass=$('#pw').value;ls.set(PK,pass);err='';render();load()});
  view.addEventListener('change',e=>{const d=e.target.dataset;if(d.mv)move(d.mv,e.target.value);else if(d.rp)setRepeat(d.rp,e.target.value)});
  view.addEventListener('click',e=>{
    const b=e.target.closest('[data-done]');if(b){move(b.dataset.done,LV.D);return}
    if(e.target.closest('#arch-h')){archOpen=!archOpen;render()}
  });
  view.addEventListener('keydown',e=>{if(e.target.id==='arch-h'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();archOpen=!archOpen;render()}});
  view.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')});
  view.addEventListener('dragend',e=>e.target.closest('.card')?.classList.remove('drag'));
  view.addEventListener('dragover',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();$$('.lane.over').forEach(x=>x!==l&&x.classList.remove('over'));l.classList.add('over')});
  view.addEventListener('dragleave',e=>{const l=e.target.closest('.lane');if(l&&!l.contains(e.relatedTarget))l.classList.remove('over')});
  view.addEventListener('drop',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();l.classList.remove('over');move(e.dataTransfer.getData('text/plain'),l.dataset.l)});

  /* tilt fx */
  const rm=matchMedia('(prefers-reduced-motion:reduce)');
  view.addEventListener('pointermove',e=>{
    if(!ui.tilt||rm.matches||e.pointerType!=='mouse')return;
    const el=e.target.closest('.tilt');$$('.tilt.tilting').forEach(x=>{if(x!==el){x.style.transform='';x.classList.remove('tilting')}});
    if(!el)return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.classList.add('tilting');el.style.transform=`perspective(700px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg)`;
  });
  view.addEventListener('pointerleave',()=>$$('.tilt.tilting').forEach(x=>{x.style.transform='';x.classList.remove('tilting')}));

  applyUi();render();load();tick();setInterval(tick,1000);
  setInterval(()=>{if(pass&&!document.hidden)load()},5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pass)load()});
})();
</script>
</body>
</html>
