<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" id="pnFontLink">
<style>
/* Layout: fixed V94 header (symbol? · view icons | page name | version · EN/VI · menu dot) → stats bar →
   4 priority lanes P1–P4 with the Done archive collapsed below → fixed V94 footer (date/time stacked under
   the view icons, FPS centred). Behind: solid + image background, scan grid, footer glow, heatwave.
   The red dot opens the V94-style CUSTOM panel (nav column + Save/Load/Reset bar as on AR). */
:root{
  --bg:#16171c; --th:#ff5fcf; --pn-c:#ff97de; --glow:#e5322d; --gk:.55; --dot:#e5322d; --scan:#22d3ee;
  --tx:#f2f2f4; --mut:#9a9aa8; --ln:rgba(255,255,255,.14); --ln2:rgba(255,255,255,.18);
  --sf:rgba(255,255,255,.035); --sf2:rgba(0,0,0,.28); --inp:rgba(0,0,0,.3); --hdbg:rgba(22,23,28,.55); --pbg:rgba(24,24,30,.82);
  --p1:#f0705a; --p2:#f0b04a; --p3:#6fb0e8; --p4:#a7adb0; --ok:#7cc98c; --pu:#b69cf2; --rem:#e6d25a; --link:#22d3ee;
  --hh:43px; --fh:44px; --lx:92px;
  --hfont:"Helvetica Black Extended","Helvetica Neue Black Extended","Helvetica Neue",Helvetica,"Arial Black",Arial,sans-serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  color-scheme:dark;
}
/* light mode: macOS-style greys, not white */
:root[data-mode=light]{
  --bg:#e4e4e9; --tx:#1d1d1f; --mut:#6e6e76; --ln:rgba(0,0,0,.1); --ln2:rgba(0,0,0,.14);
  --sf:rgba(255,255,255,.45); --sf2:rgba(255,255,255,.62); --inp:rgba(255,255,255,.7); --hdbg:rgba(236,236,240,.62); --pbg:rgba(238,238,242,.86);
  --p1:#d0432c; --p2:#b5760f; --p3:#2c6cae; --p4:#6b7076; --ok:#2e8645; --pu:#6f4dbf; --rem:#8f7400; --link:#0a6fb8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans)}
body.nosolid{background:#000}
:root[data-mode=light] body.nosolid{background:#fff}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--th);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- background layers ---------- */
#bgi{position:fixed;inset:-40px;z-index:0;pointer-events:none;background:center/cover no-repeat;opacity:0;transition:opacity .8s,background-image .8s}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;opacity:var(--fxo,.8)}
body.scan #fx{display:block}
#fx::before{content:"";position:absolute;inset:0;
  background:linear-gradient(color-mix(in srgb,var(--scan) 22%,transparent) 1px,transparent 1px) 0 0/52px 52px,
    linear-gradient(90deg,color-mix(in srgb,var(--scan) 22%,transparent) 1px,transparent 1px) 0 0/52px 52px,
    repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px);
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,transparent 85%);mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,transparent 85%)}
#fx::after{content:"";position:absolute;left:0;right:0;height:255px;top:-255px;background:linear-gradient(transparent,color-mix(in srgb,var(--scan) 25%,transparent),transparent);animation:sweep var(--sws,11s) linear infinite}
#fx.nosweep::after{display:none}
@keyframes sweep{to{top:100%}}
#glow{position:fixed;left:0;right:0;bottom:0;height:calc(var(--fh) + 230px);z-index:1;pointer-events:none;
  background:radial-gradient(75% 100% at 50% 100%,color-mix(in srgb,var(--glow) calc(var(--gk)*100%),transparent),transparent 72%),
    linear-gradient(to top,color-mix(in srgb,var(--glow) calc(var(--gk)*45%),transparent),transparent 45%)}
#fhw{position:fixed;left:0;right:0;bottom:0;height:var(--fhh,138px);z-index:29;pointer-events:none;display:none;
  -webkit-backdrop-filter:url(#fhwf);backdrop-filter:url(#fhwf);
  background:linear-gradient(to top,color-mix(in srgb,var(--glow) calc(var(--fhs,90)*.3%),transparent),transparent);
  -webkit-mask-image:linear-gradient(to top,#000 calc(100% - var(--fhs,90)*1%),transparent);mask-image:linear-gradient(to top,#000 calc(100% - var(--fhs,90)*1%),transparent)}
body.hw #fhw{display:block}

/* ---------- header (V94: 43px, 8px 14px, blur 30 / sat 1.4) ---------- */
#hd{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--hh) + env(safe-area-inset-top,0px));
  padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln);
  background:var(--hdbg);-webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  font-family:var(--hfont);font-stretch:expanded;font-size:10px;font-weight:900;user-select:none}
.hl{display:flex;align-items:center;gap:12px;min-width:0}
.hdv{width:1px;height:18px;background:rgba(154,154,168,.6);flex:none}
#hd[data-sym=none] .hdv{display:none}
#lyb{display:flex;gap:2px}
.hdv2{width:1px;height:18px;background:rgba(154,154,168,.6);flex:none}
#modeB{height:24px;display:flex;align-items:center;gap:6px;padding:0 9px 0 7px;border:1px solid var(--ln2);border-radius:12px;background:transparent;cursor:pointer;
  font:600 10px var(--mono);letter-spacing:.04em;color:var(--mut)}
#modeB svg{width:14px;height:14px}#modeB:hover{color:var(--tx)}
:root[data-mode=dark] #modeB .sun,:root[data-mode=light] #modeB .moon{display:none}
#lyb button{width:30px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center;padding:0}
#lyb button svg{width:18px;height:18px}
#lyb button:hover{color:var(--tx);background:color-mix(in srgb,var(--tx) 7%,transparent)}
#lyb button[aria-pressed=true]{color:var(--tx);background:color-mix(in srgb,var(--tx) 11%,transparent)}
#pname{position:absolute;left:50%;top:calc(50% + env(safe-area-inset-top,0px)/2);transform:translate(-50%,-50%);display:flex;align-items:center;gap:7px;
  font-size:var(--pns,10px);font-weight:var(--pnw,800);letter-spacing:var(--pnl,.4px);text-transform:var(--pnc,uppercase);color:var(--pn-c);white-space:nowrap;pointer-events:none;max-width:44vw}
#pname.cf{font-family:var(--pnf);font-stretch:normal}
#pnt{overflow:hidden;text-overflow:ellipsis}
#sym,#symd{display:none;flex:none}
#symd.on{display:block;width:calc(var(--sys,14px)*.6);height:calc(var(--sys,14px)*.6);border-radius:50%;background:currentColor}
#sym.on{display:block;height:var(--sys,14px);width:auto}
.hr{display:flex;align-items:center;gap:10px}
#ver{font:400 11px var(--mono);color:var(--mut)}
#lang{height:22px;padding:0 7px;border:1px solid var(--ln2);border-radius:6px;background:transparent;cursor:pointer;font:600 10.5px var(--mono);display:flex;gap:5px;align-items:center}
#lang b{font-weight:600;color:var(--mut)}#lang b.on{color:var(--tx)}
#lang i{width:1px;height:10px;background:var(--ln2)}
#mbtn{width:26px;height:26px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;border-radius:50%}
#mbtn i{width:10px;height:10px;border-radius:50%;background:var(--dot);box-shadow:0 0 10px color-mix(in srgb,var(--dot) 70%,transparent);transition:transform .15s}
#mbtn:hover i,#mbtn[aria-expanded=true] i{transform:scale(1.35)}

/* ---------- CUSTOM panel (V94 layout: nav column + settings; AR Save/Load/Reset bar) ---------- */
#panel{position:fixed;z-index:40;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px);right:max(8px,env(safe-area-inset-right,0px));
  width:min(900px,calc(100vw - 16px));height:min(620px,calc(100vh - var(--hh) - var(--fh) - 26px - env(safe-area-inset-top,0px)));
  display:grid;grid-template-columns:170px minmax(0,1fr);border:1px solid var(--ln2);border-radius:16px;overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.45);font:13px var(--sans)}
#pnav{background:color-mix(in srgb,var(--th) 82%,transparent);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  padding:72px 12px 14px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
#pnav .nb{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  font:800 14px var(--hfont);font-stretch:expanded;letter-spacing:.03em;text-transform:uppercase;color:#2a2b33}
#pnav .nb[aria-current=true]{background:#f3f3f6;color:#1a1b22}
#pnav .nb[aria-current=true]::after{content:"";width:3px;height:18px;border-radius:2px;background:var(--th)}
#pnav .bot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 6px}
#pnav .bot label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#2a2b33;cursor:pointer}
#pbody{background:var(--pbg);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);display:flex;flex-direction:column;min-height:0}
.pbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--ln)}
.pbar b{font:800 11px var(--hfont);font-stretch:expanded;letter-spacing:.08em;text-transform:uppercase;margin-right:auto}
.pbtn{height:28px;padding:0 12px;border:1px solid var(--ln2);border-radius:7px;background:var(--inp);cursor:pointer;font-size:12.5px;font-weight:600}
.pbtn:hover{border-color:var(--th)}
.pbtn.x{width:28px;padding:0}
#pmenu{border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;flex-direction:column;gap:8px;max-height:46%;overflow:auto}
#pmenu .pr{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
#pmenu input,#pmenu textarea{width:100%}
#pmenu .hint{font-size:11.5px;color:var(--mut);margin:0}
#psec{padding:6px 16px 18px;overflow:auto;min-height:0}
#psec h3{margin:16px 0 6px;font:800 10.5px var(--hfont);font-stretch:expanded;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.row{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.row>span:first-child{font-size:12.5px}
.row .v{font:11.5px var(--mono);color:var(--mut);text-align:right}
.row input[type=range]{width:100%;accent-color:var(--th)}
.row input[type=color]{width:46px;height:26px;border:1px solid var(--ln2);background:transparent;padding:0;border-radius:6px;cursor:pointer}
.row input[type=text],.row select{width:100%;background:var(--inp);border:1px solid var(--ln2);border-radius:6px;padding:5px 8px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ln2);border-radius:7px;overflow:hidden;width:max-content;max-width:100%}
.seg button{background:transparent;border:0;border-right:1px solid var(--ln);padding:5px 11px;cursor:pointer;font-size:12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--th);color:#16161c;font-weight:600}
.sw{position:relative;width:34px;height:18px;flex:none;display:inline-block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:9px;background:color-mix(in srgb,var(--tx) 22%,transparent);transition:background .15s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--th)}.sw input:checked+i::after{transform:translateX(16px);background:#16161c}
.sw input:focus-visible+i{outline:2px solid var(--th);outline-offset:2px}
#pnav .sw i{background:rgba(0,0,0,.25)}#pnav .sw input:checked+i{background:#2a2b33}#pnav .sw input:checked+i::after{background:var(--th)}
@media (max-width:640px){
  #panel{grid-template-columns:92px minmax(0,1fr);right:6px;width:calc(100vw - 12px)}
  #pnav{padding:14px 6px}#pnav .nb{font-size:9.5px;padding:8px 6px;letter-spacing:0}
  .row{grid-template-columns:minmax(0,1fr) 52px;gap:4px 8px}.row>:first-child{grid-column:1/-1}
  .pbar{flex-wrap:wrap;padding:10px}.pbar b{display:none}#psec{padding:4px 10px 14px}
}

/* ---------- page ---------- */
main{position:relative;z-index:2;max-width:1600px;margin:0 auto;
  padding:calc(var(--hh) + env(safe-area-inset-top,0px) + 18px) max(14px,env(safe-area-inset-right,0px)) calc(var(--fh) + 70px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
body[data-align=center] .bar{justify-content:center}
body[data-align=right] .bar{justify-content:flex-end}
.stat{font:12px var(--mono);padding:5px 9px 5px 8px;border:1px solid color-mix(in srgb,var(--sc) 55%,transparent);border-radius:6px;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--sc) 12%,transparent);color:var(--sc);display:flex;align-items:center;gap:7px}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.stat.zero{opacity:.62}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stats.stack{flex-direction:column;align-items:flex-start;width:100%}
:root[data-mode=light] .stat{color:color-mix(in srgb,var(--sc) 82%,#000);background:color-mix(in srgb,var(--sc) 14%,rgba(255,255,255,.7))}
.bar select{background:var(--inp);border:1px solid var(--ln2);border-radius:6px;padding:5px 8px;font-size:12.5px}
.btn{background:var(--inp);border:1px solid var(--ln2);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.msg{padding:14px;border:1px solid var(--ln2);border-radius:12px;background:var(--sf)}
.login{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--inp);border:1px solid var(--ln2);border-radius:6px;padding:7px 9px;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(var(--fh) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;
  background:var(--pbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--ln2);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100vw - 32px)}
form.add{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(4,minmax(0,1fr)) auto;gap:8px;padding:10px;border:1px solid var(--ln2);border-radius:12px;background:var(--sf)}
@media (max-width:900px){form.add{grid-template-columns:1fr 1fr}form.add [name=title]{grid-column:1/-1}}

.pnl{background:var(--sf);border:1px solid var(--ln2);border-radius:12px;min-width:0;display:flex;flex-direction:column}
body.mica .pnl{-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 8%,transparent)}
.ph{padding:10px 12px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph b{font:800 11px var(--hfont);font-stretch:expanded;letter-spacing:.04em;text-transform:uppercase}
.ph i{display:block;font:400 11.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--mut);margin-top:3px}
.ph .n{font:12px var(--mono);color:var(--mut)}
.list{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:72px}
.empty{font-size:12px;color:var(--mut);text-align:center;padding:14px 4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.lane.over{outline:2px dashed var(--th);outline-offset:-4px}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.arch .ph{cursor:pointer}
.arch .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));align-items:start}
.arch:not(.open) .list{display:none}
.board{grid-template-columns:repeat(4,minmax(0,1fr)) 44px}
.board.dopen{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(220px,.8fr)}
.arch.col .list{display:flex;grid-template-columns:none}
.arch.col:not(.open) .list{display:none}
.arch.col:not(.open){align-self:stretch}
.arch.col:not(.open) .ph{writing-mode:vertical-rl;transform:rotate(180deg);flex-direction:row-reverse;justify-content:flex-end;align-items:center;padding:12px 10px;height:100%}
.arch.col:not(.open) .ph i{display:none}
@media (max-width:1100px){.board,.board.dopen{grid-template-columns:repeat(2,minmax(0,1fr))}.arch.col{grid-column:1/-1}.arch.col:not(.open) .ph{writing-mode:horizontal-tb;transform:none;flex-direction:row;justify-content:space-between;height:auto}}
@media (max-width:640px){.board,.board.dopen{grid-template-columns:1fr}}

/* tracking map */
.tl .tlh{flex-wrap:wrap;align-items:center;padding-bottom:10px}
.tlc{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tlc .btn{padding:4px 10px}.tll{font:12px var(--mono);color:var(--mut);margin-left:4px}
.tlw{overflow-x:auto;padding:0 10px 12px}
.tlg{min-width:640px;position:relative}
.tlr{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);align-items:center;min-height:30px}
.tn{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px 0 9px;border-left:3px solid var(--c,transparent)}
.tt{position:relative;height:30px}
.hd0,.tlbg .tt{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.hd0 .tc{display:flex;flex-direction:column;align-items:center;justify-content:center;font:11px var(--mono);color:var(--mut);line-height:1.15}
.hd0 .tc i{font-style:normal;font-size:10px}.hd0 .tc.td b{color:var(--th)}
.tlb{position:relative}
.tlbg{position:absolute;inset:0;display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);pointer-events:none}
.tlbg .tt{height:100%}
.tlbg .tc.we{background:color-mix(in srgb,var(--tx) 4%,transparent)}
.tlbg .tc.td{background:color-mix(in srgb,var(--th) 12%,transparent);box-shadow:inset 1px 0 0 color-mix(in srgb,var(--th) 60%,transparent)}
.tlb .tlr{position:relative}
.tlb .tt{cursor:copy}
.tbar{position:absolute;top:5px;height:20px;border-radius:5px;background:color-mix(in srgb,var(--c) 70%,transparent);display:flex;align-items:center;cursor:grab;touch-action:none;user-select:none;min-width:14px}
.tbar.guess{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,transparent) 0 6px,color-mix(in srgb,var(--c) 35%,transparent) 6px 12px)}
.tbar.drag{cursor:grabbing;box-shadow:0 0 0 2px var(--c)}
.tbar.cl{border-top-left-radius:0;border-bottom-left-radius:0}.tbar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.tbar .bt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:clip;font:600 10.5px var(--mono);color:#111;padding:0 4px;text-align:center}
.tbar .hd{width:8px;align-self:stretch;cursor:ew-resize;flex:none}
.tbar .hd.l{border-left:2px solid rgba(0,0,0,.35);border-radius:5px 0 0 5px}.tbar .hd.r{border-right:2px solid rgba(0,0,0,.35);border-radius:0 5px 5px 0}
.off{position:absolute;inset:0;display:flex;align-items:center;padding-left:8px;font:11px var(--mono);color:var(--mut);pointer-events:none}

.card{border:0;border-left:3px solid var(--lc,var(--p4));border-radius:2px 8px 8px 2px;background:var(--sf2);padding:9px 10px;display:flex;flex-direction:column;gap:6px;transition:transform .15s ease}
.tr{display:flex;align-items:flex-start;gap:8px}
.tr .t{flex:1;min-width:0}
.ck,.ed{flex:none;width:20px;height:20px;padding:0;border:0;background:transparent;cursor:pointer;color:var(--mut);display:grid;place-items:center;margin-top:1px}
.ck svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.ck path{opacity:0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ck:hover{color:var(--ok)}.ck:hover path{opacity:.6}
.ck[aria-pressed=true]{color:var(--ok)}.ck[aria-pressed=true] circle{fill:var(--ok);stroke:var(--ok)}.ck[aria-pressed=true] path{opacity:1;stroke:var(--bg)}

  /* ---------- data ---------- */
  /*API-START*/
  function api(method,body){
    return fetch('/api/dwork',{method,headers:{'x-ctd-pass':pass,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
      .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.message||('Error '+r.status)),{code:j.error});return j});
  }
  /*API-END*/
  function load(force){
    if(!pass){render();return}
    if(loading)return;loading=true;if(force)toast(L().loading);
    api('GET').then(j=>{tasks=j.tasks;err='';loading=false;if(!editing)render();if(force)toast(L().updated)})
      .catch(e=>{loading=false;if(e.code==='auth'){pass='';ls.set(PK,null);err=L().wrong}else err=e.message;render()});
  }
  function patch(t,body,optimistic){
    const before=Object.assign({},t);Object.assign(t,optimistic||{});render();
    return api('PATCH',Object.assign({id:t.id},body)).then(j=>{Object.assign(t,j.task);render();
      if(j.rescheduled)toast(L().resched(dm(j.task.remind),L().rep[j.task.repeat]||j.task.repeat))})
      .catch(e=>{Object.assign(t,before);render();toast(L().fail(e.message))});
  }

  let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}

  const CHK='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M6.2 10.4l2.6 2.5 5-5.4"/></svg>';

  function card(t,drag){
    if(editing===t.id)return editCard(t);
    const l=L(),k=lk(t),done=k==='D',r=left(t.remind),s=suggest(t),showSug=!done&&RANK[s]<RANK[k];

    return `<article class="card${done?' done':''} tilt" ${drag?'draggable="true"':''} data-id="${t.id}" style="--lc:${COL[k]}">
      ${/^https?:\/\//.test(t.thumb||'')?`<img class="th" src="${esc(t.thumb)}" alt="" loading="lazy" draggable="false" onerror="this.remove()">`:''}

      ${t.note?`<div class="note">${esc(t.note)}</div>`:''}</article>`;
  }
  const opts=(list,cur,lab)=>list.map(x=>`<option value="${esc(x)}"${x===cur?' selected':''}>${esc(lab?lab(x):x)}</option>`).join('');
  const projects=()=>[...new Set(tasks.map(x=>x.project).filter(Boolean))].sort();
  const dv=v=>esc((v||'').slice(0,10));
  function editCard(t){
    const l=L();
    return `<article class="card" data-id="${t.id}" style="--lc:${COL[lk(t)]}"><form class="edit" data-save="${t.id}">
      <input name="title" value="${esc(t.title)}" aria-label="${l.title}" required>
      <div class="g">
        <label>${l.level}<select name="level">${Object.keys(COL).map(x=>`<option value="${LV[x]}"${x===lk(t)?' selected':''}>${l.lv[x][0]}</option>`).join('')}</select></label>
        <label>${l.project}<input name="project" value="${esc(t.project)}" list="projList"></label>
        <label>${l.type}<select name="type"><option value=""></option>${opts(TYPES,t.type,x=>l.types[x])}</select></label>
        <label>${l.size}<select name="size">${opts(['S','M','L'],t.size||'S')}</select></label>
        <label>${l.start}<input name="start" type="date" value="${dv(t.start)}"></label>
        <label>${l.deadline}<input name="deadline" type="date" value="${dv(t.deadline)}"></label>
        <label>${l.remind}<input name="remind" type="date" value="${dv(t.remind)}"></label>
        <label>${l.repeat}<select name="repeat">${opts(REP,t.repeat||'Một lần',x=>l.rep[x])}</select></label>
      </div>
      <input name="thumb" value="${/^https:\/\//.test(t.thumb||'')&&!/amazonaws|notion-static|file\.notion/.test(t.thumb)?esc(t.thumb):''}" placeholder="${l.thumb}" aria-label="${l.thumb}">
      <textarea name="note" rows="2" placeholder="${l.note}">${esc(t.note)}</textarea>
      <div class="ctl"><button type="submit" class="btn pri">${l.saveT}</button><button type="button" data-cancel>${l.cancel}</button>
        <button type="button" data-del="${t.id}">${confirmDel===t.id?l.delC:l.del}</button></div>
    </form></article>`;
  }
  function lane(k,list){
    const [name,rule]=L().lv[k];
    return `<section class="pnl lane" data-l="${LV[k]}"><div class="ph"><b style="color:${COL[k]}">${name}<i>${rule}</i></b><span class="n">${list.length}</span></div>
      <div class="list">${list.length?list.map(t=>card(t,true)).join(''):`<div class="empty">${L().drop}</div>`}</div></section>`;
  }
  function archive(list,col){
    const [name,rule]=L().lv.D;
    return `<section class="pnl lane arch${archOpen?' open':''}${col?' col':''}" data-l="${LV.D}"><div class="ph" id="arch-h" role="button" tabindex="0" aria-expanded="${archOpen}"><b style="color:var(--ok)">${name}<i>${rule}</i></b><span class="n">${list.length} ${archOpen?'▴':'▾'}</span></div>
      <div class="list">${list.length?list.map(t=>card(t,true)).join(''):`<div class="empty">${L().noneYet}</div>`}</div></section>`;
  }
  const shown=()=>tasks.filter(t=>!filter||t.project===filter);
  const by=k=>shown().filter(t=>lk(t)===k).sort(cmp);
  const viewBoard=()=>`<div class="board${archOpen?' dopen':''}">${['P1','P2','P3','P4'].map(k=>lane(k,by(k))).join('')}${archive(by('D'),true)}</div>`;
  function frame(title,sub,list){
    const next=list.filter(t=>dueOf(t)).sort((a,b)=>dueOf(a)<dueOf(b)?-1:1)[0];
    return `<section class="pnl tilt"><div class="big"><div class="k">${title}</div>
        <div class="cd" ${next?`data-cd="${dueOf(next)}"`:''}>${next?fmtCd(dueOf(next)):'—'}</div>
        <div class="cdl">${next?esc(next.title):sub}</div></div>
      <div class="list">${list.length?list.map(t=>card(t,false)).join(''):`<div class="empty">${L().noneL}</div>`}</div></section>`;
  }
  function viewFrames(){const l=L();const f=ks=>shown().filter(t=>ks.includes(lk(t))).sort(cmp);
    return `<div class="frames">${frame(l.short,l.shortS,f(['P1','P2']))}${frame(l.mid,l.midS,f(['P3']))}${frame(l.long,l.longS,f(['P4']))}</div>`+archive(by('D'))}
  const viewList=()=>`<div class="stack">${['P1','P2','P3','P4'].map(k=>lane(k,by(k))).join('')}${archive(by('D'))}</div>`;

  /* ---------- tracking map: week / month, drag bars to change start + deadline ---------- */
  const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
  const pd=s=>new Date(s.slice(0,10)+'T00:00:00');
  const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
  const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
  const DUR={S:0,M:4,L:13};
  let tlOff=0;
  function tlRange(){
    const t=day0();
    if(ui.tlScale==='month'){const a=new Date(t.getFullYear(),t.getMonth()+tlOff,1),b=new Date(a.getFullYear(),a.getMonth()+1,0);return [iso(a),b.getDate()]}
    const m=new Date(t);m.setDate(m.getDate()-((m.getDay()+6)%7)+tlOff*7);return [iso(m),7];
  }
  function span(t){
    if(!t.deadline&&!t.start)return null;
    const e=(t.deadline||t.start).slice(0,10),s=(t.start||addD(e,-(DUR[t.size]??0))).slice(0,10);
    return {s:s<=e?s:e,e:s<=e?e:s,guess:!t.start};
  }
  function viewTl(){
    if(!ui.tl)return '';
    const l=L(),[a,n]=tlRange(),today=iso(day0()),z=pd(a);
    const DOW=ui.lang==='vi'?['CN','T2','T3','T4','T5','T6','T7']:['Su','Mo','Tu','We','Th','Fr','Sa'];
    const days=[...Array(n)].map((_,i)=>addD(a,i));
    const head=days.map(d=>{const x=pd(d),we=x.getDay()===0||x.getDay()===6;return `<div class="tc${we?' we':''}${d===today?' td':''}">${ui.tlScale==='week'?`<i>${DOW[x.getDay()]}</i>`:''}<b>${x.getDate()}</b></div>`}).join('');
    const bgc=days.map(d=>{const x=pd(d);return `<div class="tc${x.getDay()===0||x.getDay()===6?' we':''}${d===today?' td':''}"></div>`}).join('');
    const rows=shown().filter(t=>lk(t)!=='D').sort((x,y)=>RANK[lk(x)]-RANK[lk(y)]||cmp(x,y)).map(t=>{
      const sp=span(t),k=lk(t);let bar='';
      if(sp){const i0=diffD(a,sp.s),i1=diffD(a,sp.e);
        if(i1>=0&&i0<n){const c0=Math.max(0,i0),c1=Math.min(n-1,i1);
          bar=`<div class="tbar${sp.guess?' guess':''}${i0<0?' cl':''}${i1>=n?' cr':''}" data-tb="${t.id}" style="--c:${COL[k]};left:${c0*100/n}%;width:${(c1-c0+1)*100/n}%" title="${esc(t.title)} · ${dm(sp.s)} → ${dm(sp.e)}">
            <span class="hd l" data-h="s"></span><span class="bt">${dm(sp.s)}${sp.s!==sp.e?' → '+dm(sp.e):''}</span><span class="hd r" data-h="e"></span></div>`}
        else bar=`<span class="off">${i1<0?'‹ ':''}${dm(sp.s)} → ${dm(sp.e)}${i0>=n?' ›':''}</span>`}
      else bar=`<span class="off">${l.tlNoDate}</span>`;
      return `<div class="tlr"><div class="tn" style="--c:${COL[k]}" title="${esc(t.title)}">${esc(t.title)}</div><div class="tt" data-tr="${t.id}">${bar}</div></div>`}).join('');
    const lab=ui.tlScale==='month'?z.toLocaleDateString(ui.lang==='vi'?'vi-VN':'en-US',{month:'long',year:'numeric'}):`${dm(a)} – ${dm(addD(a,6))}`;
    return `<section class="pnl tl" id="tl" style="--n:${n}"><div class="ph tlh"><b>${l.tlTitle}<i>${l.tlHint}</i></b>
        <div class="tlc"><div class="seg" id="tl-sc"><button type="button" data-sc="week" aria-pressed="${ui.tlScale==='week'}">${l.tlWeek}</button><button type="button" data-sc="month" aria-pressed="${ui.tlScale==='month'}">${l.tlMonth}</button></div>
        <button type="button" class="btn" data-tlo="-1" aria-label="‹">‹</button><button type="button" class="btn" data-tlo="0">${l.tlToday}</button><button type="button" class="btn" data-tlo="1" aria-label="›">›</button><span class="tll">${lab}</span></div></div>
      <div class="tlw"><div class="tlg"><div class="tlr th0"><div class="tn"></div><div class="tt hd0">${head}</div></div>
        <div class="tlb"><div class="tlbg"><div class="tn"></div><div class="tt">${bgc}</div></div>${rows}</div></div></div></section>`;
  }
  function addForm(){
    const l=L();
    return `<form class="add" id="addf" autocomplete="off">
      <input name="title" placeholder="${l.newTask}" aria-label="${l.title}" required>
      <input name="project" placeholder="${l.project}" aria-label="${l.project}" list="projList">
      <select name="type" aria-label="${l.type}">${opts(TYPES,'Cá nhân',x=>l.types[x])}</select>
      <input name="deadline" type="date" aria-label="${l.deadline}">
      <select name="size" aria-label="${l.size}">${['S','M','L'].map(x=>`<option value="${x}">${l.sizes[x]}</option>`).join('')}</select>
      <button class="btn pri" type="submit">${l.addBtn}</button></form>`;
  }
  function bar(){
    const l=L(),open=tasks.filter(t=>lk(t)!=='D');
    const late=open.filter(t=>left(t.deadline)!==null&&left(t.deadline)<0).length;
    const rem=open.filter(t=>left(t.remind)!==null&&left(t.remind)<=0).length;
    const act=new Set(tasks.filter(t=>lk(t)==='P1'||lk(t)==='P2').map(t=>t.project||'—')).size,pr=projects();
    const st=(n,txt,c)=>`<span class="stat${n?'':' zero'}" style="--sc:${c}">${txt}</span>`;
    const dn=tasks.filter(t=>lk(t)==='D').length;
    return `<div class="stats${ui.statStack?' stack':''}">`+st(open.length,l.open(open.length),'var(--p3)')+st(late,l.late(late),'var(--p1)')+st(rem,l.remN(rem),'var(--rem)')+st(act,l.act(act),act>3?'var(--p1)':'var(--pu)')+st(dn,l.doneN(dn),'var(--ok)')+`</div>
      <select id="fp" aria-label="${l.project}"><option value="">${l.all}</option>${pr.map(p=>`<option${p===filter?' selected':''}>${esc(p)}</option>`).join('')}</select>
      <button class="btn${adding?'':' pri'}" type="button" id="b-add">${adding?l.close:l.add}</button>
      <datalist id="projList">${pr.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`;
  }
  function render(){
    const l=L(),v=$('#view'),b=$('#bar');
    if(!pass){b.innerHTML='';v.innerHTML=`<div class="msg"><form class="login" id="lf"><label for="pw">${l.pass}</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn pri" type="submit">${l.unlock}</button></form>${err?`<div style="margin-top:8px;color:var(--p1);font-size:13px">${esc(err)}</div>`:''}</div>`;return}
    if(err&&!tasks.length){b.innerHTML='';v.innerHTML=`<div class="msg">${esc(err)}</div>`;return}
    if(!tasks.length){b.innerHTML='';v.innerHTML=`<div class="msg">${l.loading}</div>`;return}
    b.innerHTML=bar();
    v.innerHTML=(adding?addForm():'')+(ui.view==='frames'?viewFrames():ui.view==='list'?viewList():viewBoard())+viewTl();
  }

  /* ---------- board events ---------- */
  $('#bar').addEventListener('change',e=>{if(e.target.id==='fp'){filter=e.target.value;render()}});
  $('#bar').addEventListener('click',e=>{if(e.target.id==='b-add'){adding=!adding;render();if(adding)$('#addf [name=title]').focus()}});
  const view=$('#view');
  view.addEventListener('submit',e=>{
    e.preventDefault();const f=e.target;
    if(f.id==='lf'){pass=$('#pw').value;ls.set(PK,pass);err='';render();load();return}
    if(f.id==='addf'){
      const d={title:f.title.value.trim(),project:f.project.value.trim(),type:f.type.value,deadline:f.deadline.value||'',size:f.size.value};
      if(!d.title)return;d.level=LV[suggest(d)];
      const btn=f.querySelector('[type=submit]');btn.disabled=true;
      api('POST',d).then(j=>{tasks.push(j.task);f.reset();btn.disabled=false;render();$('#addf [name=title]')?.focus();toast(L().savedN)})
        .catch(er=>{btn.disabled=false;toast(L().fail(er.message))});
      return;
    }
    if(f.dataset.save){
      const t=tasks.find(x=>x.id===f.dataset.save);if(!t)return;
      const d={title:f.title.value.trim(),level:f.level.value,project:f.project.value.trim(),type:f.type.value,start:f.start.value||'',deadline:f.deadline.value||'',size:f.size.value,remind:f.remind.value||'',repeat:f.repeat.value,note:f.note.value.trim()};
      if(d.level!==t.level){d.prevLevel=t.level;d.currentRepeat=t.repeat}
      const th=f.thumb.value.trim();if(th)d.thumb=th;
      editing=null;confirmDel=null;const o=Object.assign({},d);delete o.prevLevel;delete o.currentRepeat;patch(t,d,o).then(()=>toast(L().savedN));
    }
  });
  view.addEventListener('change',e=>{const d=e.target.dataset;if(d.mv)move(d.mv,e.target.value)});
  view.addEventListener('click',e=>{
    const q=s=>e.target.closest(s);let b;
    if(b=q('[data-done]')){const t=tasks.find(x=>x.id===b.dataset.done);if(t)move(t.id,lk(t)==='D'?LV[suggest(t)]:LV.D);return}
    if(b=q('[data-sug]')){const t=tasks.find(x=>x.id===b.dataset.sug);if(t)move(t.id,LV[suggest(t)]);return}
    if(b=q('[data-edit]')){editing=b.dataset.edit;confirmDel=null;render();view.querySelector('.edit [name=title]')?.focus();return}
    if(q('[data-cancel]')){editing=null;confirmDel=null;render();return}
    if(b=q('[data-del]')){const id=b.dataset.del;
      if(confirmDel!==id){confirmDel=id;render();return}
      const i=tasks.findIndex(x=>x.id===id),t=tasks[i];editing=null;confirmDel=null;tasks.splice(i,1);render();
      api('DELETE',{id}).then(()=>toast(L().deleted)).catch(er=>{tasks.splice(i,0,t);render();toast(L().fail(er.message))});return}
    if(q('#arch-h')){archOpen=!archOpen;render();return}
    if(b=q('[data-sc]')){ui.tlScale=b.dataset.sc;tlOff=0;save();render();return}
    if(b=q('[data-tlo]')){tlOff=+b.dataset.tlo?tlOff+(+b.dataset.tlo):0;render();return}
    if((b=q('.tt[data-tr]'))&&!q('.tbar')&&!tlDrag){const t=tasks.find(x=>x.id===b.dataset.tr);if(!t)return;
      const [a,n]=tlRange(),r=b.getBoundingClientRect(),i=Math.min(n-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*n))),d=addD(a,i);
      patch(t,{start:d,deadline:t.deadline||d},{start:d,deadline:t.deadline||d});return}
  });
  /* drag a bar: body moves both dates, the ends move start or deadline; snaps to whole days */
  let tlDrag=null;
  view.addEventListener('pointerdown',e=>{
    const bar=e.target.closest('.tbar');if(!bar||e.button>0)return;const t=tasks.find(x=>x.id===bar.dataset.tb),sp=t&&span(t);if(!sp)return;
    const tr=bar.parentNode,[a,n]=tlRange();
    tlDrag={t,bar,a,n,w:tr.getBoundingClientRect().width/n,x:e.clientX,mode:e.target.dataset.h||'m',s0:sp.s,e0:sp.e,s:sp.s,e:sp.e,moved:false};
    bar.setPointerCapture(e.pointerId);bar.classList.add('drag');e.preventDefault();
  });
  view.addEventListener('pointermove',e=>{
    const D=tlDrag;if(!D)return;const k=Math.round((e.clientX-D.x)/D.w);if(k)D.moved=true;
    let s1=D.s0,e1=D.e0;if(D.mode==='m'){s1=addD(D.s0,k);e1=addD(D.e0,k)}else if(D.mode==='s'){s1=addD(D.s0,k);if(s1>e1)s1=e1}else{e1=addD(D.e0,k);if(e1<s1)e1=s1}
    D.s=s1;D.e=e1;const i0=Math.max(0,diffD(D.a,s1)),i1=Math.min(D.n-1,diffD(D.a,e1));
    D.bar.style.left=i0*100/D.n+'%';D.bar.style.width=Math.max(0,i1-i0+1)*100/D.n+'%';D.bar.querySelector('.bt').textContent=dm(s1)+(s1!==e1?' → '+dm(e1):'');
  });
  const endDrag=()=>{const D=tlDrag;if(!D)return;setTimeout(()=>{tlDrag=null},0);D.bar.classList.remove('drag');
    if(D.moved&&(D.s!==D.s0||D.e!==D.e0||D.t.start!==D.s)){patch(D.t,{start:D.s,deadline:D.e},{start:D.s,deadline:D.e}).then(()=>toast(L().savedN))}else render()};
  view.addEventListener('pointerup',endDrag);view.addEventListener('pointercancel',endDrag);
  view.addEventListener('keydown',e=>{if(e.target.id==='arch-h'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();archOpen=!archOpen;render()}});
  view.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')});
  view.addEventListener('dragend',e=>e.target.closest('.card')?.classList.remove('drag'));
  view.addEventListener('dragover',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();$$('.lane.over').forEach(x=>x!==l&&x.classList.remove('over'));l.classList.add('over')});
  view.addEventListener('dragleave',e=>{const l=e.target.closest('.lane');if(l&&!l.contains(e.relatedTarget))l.classList.remove('over')});
  view.addEventListener('drop',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();l.classList.remove('over');move(e.dataTransfer.getData('text/plain'),l.dataset.l)});
  const rm=matchMedia('(prefers-reduced-motion:reduce)');
  view.addEventListener('pointermove',e=>{
    if(!ui.tilt||rm.matches||e.pointerType!=='mouse')return;
    const el=e.target.closest('.tilt');$$('.tilt.tilting').forEach(x=>{if(x!==el){x.style.transform='';x.classList.remove('tilting')}});
    if(!el||el.querySelector('.edit'))return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.classList.add('tilting');el.style.transform=`perspective(700px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg)`;
  });
  view.addEventListener('pointerleave',()=>$$('.tilt.tilting').forEach(x=>{x.style.transform='';x.classList.remove('tilting')}));

  applyUi();render();load();tick();setInterval(tick,1000);
  setInterval(()=>{if(pass&&!document.hidden&&!editing&&!adding)load()},5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pass&&!editing)load()});
})();
</script>
</body>
</html>
