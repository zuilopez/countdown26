/* Layout: fixed V94 header (view icons · DARK · FX | page name + symbol | version · EN/VI · menu dot) → big digital
   countdown to the next deadline → stats → 4 priority lanes P1–P4 + collapsible Done column → tracking map →
   fixed footer (date/time stacked under the view icons). Behind: solid + image background, scan grid, heatwave.
   The red dot opens the CUSTOM panel: mica sliders on top, Save/Load/Reset/Import bar, sections on the left. */
:root{
  --bg:#16171c; --th:#e5322d; --pn-c:#ff97de; --hwc:#e5322d; --pbase:#18181e; --mo:.82; --mb:26px; --ms:1.3; --dgc:#ff5f6d; --dot:#e5322d; --scan:#22d3ee;
  --tx:#f2f2f4; --mut:#9a9aa8; --ln:rgba(255,255,255,.14); --ln2:rgba(255,255,255,.18);
  --sf:rgba(255,255,255,.05); --sf2:rgba(255,255,255,.045); --inp:rgba(0,0,0,.3); --hdbg:rgba(22,23,28,.55); --pbg:rgba(24,24,30,.82);
  --p1:#f0705a; --p2:#f0b04a; --p3:#6fb0e8; --p4:#a7adb0; --ok:#7cc98c; --pu:#b69cf2; --rem:#e6d25a; --link:#22d3ee;
  --hh:84px;
  --hfont:"Helvetica Black Extended","Helvetica Neue Black Extended","Helvetica Neue",Helvetica,"Arial Black",Arial,sans-serif;
  --ui:"Chakra Petch","Be Vietnam Pro",system-ui,sans-serif; --pop:"Poppins","Be Vietnam Pro",system-ui,sans-serif; --rt:rgba(255,255,255,.18); --rfi:#d6d6dc;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  color-scheme:dark;
}
/* light mode: macOS-style greys, not white */
:root[data-mode=light]{
  --pbase:#eeeef2; --rt:rgba(0,0,0,.2); --rfi:#3a3a42;
  --bg:#d3d3d9; --tx:#1d1d1f; --mut:#62626b; --ln:rgba(0,0,0,.1); --ln2:rgba(0,0,0,.14);
  --sf:rgba(255,255,255,.28); --sf2:rgba(255,255,255,.4); --inp:rgba(255,255,255,.5); --hdbg:rgba(214,214,220,.65); --pbg:rgba(222,222,228,.88);
  --p1:#d0432c; --p2:#b5760f; --p3:#2c6cae; --p4:#6b7076; --ok:#2e8645; --pu:#6f4dbf; --rem:#8f7400; --link:#0a6fb8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--th);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- background layers ---------- */
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#fx .rgs{position:absolute;inset:0;opacity:var(--ri,.7);}
#fx{display:block}body:not(.scan) #fx::before{display:none}
#fx::before{content:"";position:absolute;inset:0;opacity:var(--fxo,.8);
  background:linear-gradient(color-mix(in srgb,var(--scan) 22%,transparent) 1px,transparent 1px) calc(50% + var(--gs,52px)/2) calc(50% + var(--gs,52px)/2)/var(--gs,52px) var(--gs,52px),
    linear-gradient(90deg,color-mix(in srgb,var(--scan) 22%,transparent) 1px,transparent 1px) calc(50% + var(--gs,52px)/2) calc(50% + var(--gs,52px)/2)/var(--gs,52px) var(--gs,52px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px);
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 85%);mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 85%)}
#fx .rg{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);border-radius:50%;
  border:var(--rw,1.5px) solid color-mix(in srgb,var(--rgc) 60%,transparent);box-shadow:0 0 var(--rb,20px) color-mix(in srgb,var(--rgc) 30%,transparent),inset 0 0 var(--rb,20px) color-mix(in srgb,var(--rgc) 18%,transparent);
  opacity:var(--ro,1);animation:ring var(--sws,30s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes ring{0%{width:0;height:0}100%{width:240vmax;height:240vmax}}
@keyframes ringo{0%{opacity:1}100%{opacity:var(--rend,0)}}
#fx.nosweep .rg{display:none}
#fx.dots::before{background:var(--dimg) calc(50% + var(--gs,52px)/2 - var(--ds,3px)/2) calc(50% + var(--gs,52px)/2 - var(--ds,3px)/2)/var(--gs,52px) var(--gs,52px)}

/* ---------- header (V94: 43px, 8px 14px, blur 30 / sat 1.4) ---------- */
html,body{min-height:100%}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
#hd{position:relative;z-index:30;width:100%;max-width:1280px;margin:0 auto;min-height:var(--hh);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;
  font-family:var(--hfont);font-stretch:expanded;font-size:10px;font-weight:900;user-select:none}
.hl{display:flex;align-items:center;gap:12px;min-width:0}
.hdv{width:1px;height:18px;background:rgba(154,154,168,.6);flex:none}
#hd[data-sym=none] .hdv{display:none}
.hdv2{width:1px;height:18px;background:rgba(154,154,168,.6);flex:none}
#modeB{height:24px;display:flex;align-items:center;gap:6px;padding:0 9px 0 7px;border:1px solid var(--ln2);border-radius:12px;background:transparent;cursor:pointer;
  font:600 10px var(--mono);letter-spacing:.04em;color:var(--mut)}
#modeB svg,#fxB svg{width:16px;height:16px;flex:none}
/* focus mode */
#fcB{width:22px;height:22px;padding:0;border:0;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center;flex:none}
#fcB svg{width:18px;height:18px;overflow:visible}#fcB:hover{color:var(--tx)}
#fcB .fg{transform-box:view-box;transform-origin:12px 12px;animation:orbit var(--sws,30s) linear infinite}
#fcB .fr2{animation-duration:calc(var(--sws,30s)/1.5);animation-direction:reverse;color:color-mix(in srgb,currentColor 75%,#000)}#fcB .fr2 circle{stroke:color-mix(in srgb,currentColor 75%,#000)}
#fcB .fr3{animation-duration:calc(var(--sws,30s)/3)}#fcB .fr3 circle{stroke:color-mix(in srgb,currentColor 56%,#000)}
@keyframes orbit{to{transform:rotate(360deg)}}
#fcB[aria-pressed=true] .fd{fill:var(--th);filter:drop-shadow(0 0 4px var(--th))}
body.focus #fcB{position:fixed;z-index:31;left:calc(50% - 11px);top:var(--fcy,12px)}
#work,#pnbox,#modeB,#fxB{transition:opacity .45s ease}
body.focus #work,body.focus #pnbox,body.focus #modeB,body.focus #fxB{opacity:0;pointer-events:none}
body.fexit #hero{opacity:0}
#focus{position:fixed;inset:0;z-index:24;display:grid;place-items:center;pointer-events:none}
#focus .fgr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;width:100%}
#focus .fn,#focus .fdt{justify-self:center;text-align:center;max-width:90%}
#focus .fn{font:600 clamp(10px,.975vw,15px)/1.25 var(--cff,var(--sans));color:var(--tx)}
#focus .fdt{font:600 clamp(10px,.975vw,15px)/1.3 var(--cff,var(--sans));color:var(--mut);white-space:nowrap}

.szb{position:absolute;right:0;top:calc(35% + 3px);bottom:-9px;width:3px;background:var(--lc);opacity:.85;pointer-events:none;border-radius:1px 1px 0 0}
.card[data-sz=M] .szb{width:8px;background:repeating-linear-gradient(90deg,var(--lc) 0 3px,transparent 3px 5px)}
.card[data-sz=L] .szb{width:13px;background:repeating-linear-gradient(90deg,var(--lc) 0 3px,transparent 3px 5px)}
.card[data-sz=Q] .szb{width:18px;background:repeating-linear-gradient(90deg,var(--lc) 0 3px,transparent 3px 5px)}
.ccd{opacity:.5}
.drow{padding:6px 12px}.drow .dm{display:inline-block;width:1.25em;font-weight:700}.drow .dm.ok{color:var(--ok)}.drow .dm.lt{color:var(--p1)}
.tlc{margin-left:auto}.tl.shut .tlc{display:none}
.tlleg{display:flex;gap:10px;align-items:center;margin-left:8px}
.tlh>b i{opacity:0;transition:opacity .25s;color:color-mix(in srgb,var(--mut) 60%,transparent)}.tlh:hover>b i{opacity:1}

/* footer panel (v0.26) */
.fsel{display:flex;flex-direction:column;gap:6px;padding:2px 0 6px}.fsel>span{font-size:12px;color:var(--mut)}.fsel>div{display:flex;flex-wrap:wrap;gap:4px}.fsel .chipb{flex:1 1 auto;text-align:center;padding:4px 8px}
.fbx{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:start;padding:2px 0 6px}.fbx textarea{width:100%;min-height:44px;resize:vertical}.fbx.dragging{opacity:.4}
.fbh{cursor:grab;color:var(--mut);font-size:13px;letter-spacing:-2px;line-height:1.1;padding-top:6px;user-select:none}.fbh:active{cursor:grabbing}
.fadd{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px}.fadd .fcnt{font:11px var(--mono);color:var(--mut)}.fadd .pbtn[disabled]{opacity:.4;cursor:not-allowed}
.falg{display:flex;justify-content:flex-start;padding:4px 0}.falg .seg{display:flex;gap:2px;width:auto}.falg .seg button{width:32px;height:26px;display:grid;place-items:center;padding:0}
body.cust .fbox{resize:horizontal;overflow:hidden;min-width:3em}
/* CUSTOM rows fill the width */
.row>span:empty{display:none}.row>.seg,.row>select,.row>input[type=text]{grid-column:2/4;width:100%}.row>.seg button{flex:1}
.lockg.lk{opacity:.35;pointer-events:none;filter:grayscale(1)}

/* v0.27 */
.sugr{display:flex;justify-content:flex-end}
.ph .rule{text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;font-weight:600;opacity:.5}
#modeB{flex-direction:row-reverse;justify-content:flex-end!important}.hr>#modeB:hover span,.hr>#modeB:focus-visible span{margin-left:0;margin-right:6px}
#modeB,#fxB{transition:transform .55s cubic-bezier(.6,0,.4,1),opacity .55s ease-in}
body.focus #modeB{transform:translateX(-62vw);opacity:0;pointer-events:none}body.focus #fxB{transform:translateX(62vw);opacity:0;pointer-events:none}
/* new task, step by step */
.stp{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .25s ease,opacity .25s ease;grid-column:1/-1}.stp.on{grid-template-rows:1fr;opacity:1}.stp>div{overflow:hidden;min-height:0;display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}.stp.on>div{padding:3px 0}
.stp .pick{flex:1;min-width:0}.stp .pick select,.stp .pick input{width:100%}
.acust{display:flex;gap:6px;align-items:center;width:100%}.acust input{font:12px var(--mono);background:var(--inp);border:1px solid var(--ln2);border-radius:6px;padding:4px 6px;color:var(--tx);flex:1;min-width:0}.acust .tmb{display:flex;align-items:center;gap:4px;border:1px solid var(--ln2);background:transparent;color:var(--mut);border-radius:6px;padding:4px 8px;cursor:pointer;font:12px var(--mono)}.acust .tmb svg{width:15px;height:15px}
.stp .btn.pri{width:100%;background:var(--th);border-color:var(--th);color:#fff;font-weight:600}.stp .dlq{width:100%}.stp .qd{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 8px}.stp .qd svg{width:15px;height:15px;flex:none}.stp .qd span{font:11px var(--mono)}
#modeB span{flex:none}
</style>

      tx.innerHTML='';const cur=document.createElement('span');cur.className='cur';cur.textContent='▌';el.appendChild(cur);
      await new Promise(res=>{const f=now=>{const k=Math.min(1,(now-t0)/dur),n=Math.floor(fin.length*k);
        el.style.clipPath=`inset(0 ${Math.round((1-k)*100)}% 0 0)`;
        tx.textContent=fin.slice(0,n)+Array.from({length:Math.min(3,fin.length-n)},()=>CH[Math.random()*CH.length|0]).join('');
        if(k<1&&el.isConnected)requestAnimationFrame(f);else{tx.textContent=fin;el.style.clipPath='';el.classList.remove('pre');cur.remove();res()}};requestAnimationFrame(f)})}
    $$('#bar .stat.pre').forEach(e=>{e.classList.remove('pre');e.style.clipPath=''});
  }
  function render(){
    const l=L(),v=$('#view'),b=$('#bar');
    if(!pass){b.innerHTML='';$('#hero').innerHTML='';$('#tlw').innerHTML='';$('#donew').innerHTML='';v.innerHTML=`<div class="msg"><form class="login" id="lf"><label for="pw">${l.pass}</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn pri" type="submit">${l.unlock}</button></form>${err?`<div style="margin-top:8px;color:var(--p1);font-size:13px">${esc(err)}</div>`:''}</div>`;return}
    if(err&&!tasks.length){b.innerHTML='';$('#hero').innerHTML='';$('#tlw').innerHTML='';$('#donew').innerHTML='';v.innerHTML=`<div class="msg">${esc(err)}</div>`;return}
    if(!tasks.length){b.innerHTML='';$('#hero').innerHTML='';$('#tlw').innerHTML='';$('#donew').innerHTML='';v.innerHTML=`<div class="msg">${l.loading}</div>`;return}

    v.innerHTML=viewBoard();$('#donew').innerHTML=lane('D',by('D'),false);$('#tlw').innerHTML=viewTl();fitHero();if(!revealed&&!matchMedia('(prefers-reduced-motion: reduce)').matches)revealTags();
  }

  /* ---------- board events ---------- */
  $('#bar').addEventListener('change',e=>{if(e.target.id==='fp'){filter=e.target.value;render()}});
  $('#bar').addEventListener('click',e=>{const rn=e.target.closest('[data-rn]');if(rn){renaming=rn.dataset.rn;render();const i=$('#bar [data-rni]');if(i){i.focus();i.select()}return}const gp=e.target.closest('[data-grp]');if(gp){openG=openG===gp.dataset.grp?'':gp.dataset.grp;render();return}const pj=e.target.closest('[data-pj]');if(pj){filter=filter===pj.dataset.pj?'':pj.dataset.pj;if(filter)touch('pj:'+filter);openG='';render();return}const q=e.target.closest('[data-qf]');if(q){qf=qf===q.dataset.qf?'':q.dataset.qf;if(/^sz/.test(qf))touch('sz:'+qf.slice(2));if(/^sz/.test(q.dataset.qf))openG='';render();return}if(e.target.id==='b-add'){adding=!adding;render();if(adding)$('#addf [name=title]').focus()}});
  function rnCommit(i){const old=i.dataset.rni,nv=i.value.trim();renaming='';if(!nv||nv===old){render();return}if(filter===old)filter=nv;const ts=tasks.filter(t=>t.project===old);render();ts.reduce((pr,t)=>pr.then(()=>patch(t,{project:nv},{project:nv})),Promise.resolve())}
  $('#bar').addEventListener('keydown',e=>{const i=e.target.closest('[data-rni]');if(!i)return;if(e.key==='Enter'){e.preventDefault();rnCommit(i)}else if(e.key==='Escape'){renaming='';render()}});
  $('#bar').addEventListener('focusout',e=>{const i=e.target.closest&&e.target.closest('[data-rni]');if(i&&renaming)rnCommit(i)});
  const top=$('#top');
  top.addEventListener('dragover',e=>{const z=e.target.closest('#heroZ');if(!z)return;e.preventDefault();z.classList.add('over')});
  top.addEventListener('dragleave',e=>{const z=e.target.closest('#heroZ');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over')});
  top.addEventListener('drop',e=>{const z=e.target.closest('#heroZ');if(!z)return;e.preventDefault();ui.heroId=e.dataTransfer.getData('text/plain');save();render()});
  top.addEventListener('click',e=>{if(e.target.closest('[data-hauto]')){ui.heroId='';save();render()}});
  const view=$('#view'),zone=document.body;
  /* bring Done / Timeline into view inside the right column only (the page itself never scrolls) */
  function rcolTo(sel){const el=$(sel),rc=$('#rcol');if(!el)return;
    if(innerWidth<=760){el.scrollIntoView({behavior:'smooth',block:'nearest'});return}
    const r=el.getBoundingClientRect(),c=rc.getBoundingClientRect();if(r.bottom>c.bottom)rc.scrollBy({top:r.bottom-c.bottom+8,behavior:'smooth'})}
  zone.addEventListener('submit',e=>{
    e.preventDefault();const f=e.target;
    if(f.id==='lf'){pass=$('#pw').value;ls.set(PK,pass);err='';render();load();return}
    if(f.id==='addf'){
      const d={title:f.title.value.trim(),project:(touch('pj:'+pv(f,'project')),pv(f,'project')),type:(touch('ty:'+pv(f,'type')),pv(f,'type')),deadline:f.deadline.value||'',size:autoSize(f.deadline.value)};
      if(!d.title||!f.querySelector('.s4.on'))return;d.level=LV[d.deadline?suggest(d):({S:'P2',M:'P3',L:'P4'}[d.size]||'P4')];
      const btn=f.querySelector('[type=submit]');btn.disabled=true;
      api('POST',d).then(j=>{tasks.push(j.task);btn.disabled=false;render();$('#addf [name=title]')?.focus();toast(L().savedN)})
        .catch(er=>{btn.disabled=false;toast(L().fail(er.message))});
      return;
    }
    if(f.dataset.save){
      const t=tasks.find(x=>x.id===f.dataset.save);if(!t)return;
      const rv=!f.repon.checked?'Một lần':f.repeat.value==='custom'?`Mỗi ${Math.min(365,Math.max(1,+f.repn.value||1))} ngày`:f.repeat.value;
      const d={title:f.title.value.trim(),project:(touch('pj:'+pv(f,'project')),pv(f,'project')),type:(touch('ty:'+pv(f,'type')),pv(f,'type')),start:f.start.value||'',deadline:f.deadline.value||'',size:f.size.value,repeat:rv,note:f.note.value.trim()};
      editing=null;confirmDel=null;const o=Object.assign({},d);delete o.prevLevel;delete o.currentRepeat;patch(t,d,o).then(()=>toast(L().savedN));
    }
  });
  const aSet=f=>{const dt=f.querySelector('[data-adate]').value,tm=f.querySelector('[data-atime]').value;f.deadline.value=dt?dt+(tm?'T'+tm:''):'';const sp=f.querySelector('[data-cu] span');if(sp)sp.textContent=dt?dlLabel(f.deadline.value):'';f.querySelectorAll('.dlq .qd')[0].setAttribute('aria-pressed','false');f.querySelectorAll('.dlq .qd')[1].setAttribute('aria-pressed','false')};
  zone.addEventListener('change',e=>{const f=e.target.form;if(f&&f.id==='addf'&&(e.target.matches('[data-adate],[data-atime]'))){aSet(f);addSteps(f)}});
  zone.addEventListener('input',e=>{const f=e.target.form;if(f&&f.id==='addf'&&e.target.matches('[data-adate],[data-atime]')){aSet(f);addSteps(f)}});
  zone.addEventListener('change',e=>{const d=e.target.dataset,f=e.target.form;if(!f)return;if(d.mv)move(d.mv,e.target.value);
    if('pick' in d){const i=f[e.target.name+'_new'];i.hidden=e.target.value!=='__new';if(!i.hidden)i.focus()}
    if(e.target.name==='repon'){f.repeat.disabled=!e.target.checked;if(f.repn)f.repn.disabled=!e.target.checked}
    if(e.target.name==='repeat'&&f.repn){f.querySelector('.rpc').hidden=e.target.value!=='custom'}});
  ['click','change','input'].forEach(ev=>zone.addEventListener(ev,e=>{const f=e.target.closest&&e.target.closest('#addf');if(f)setTimeout(()=>addSteps(f),0)}));
  zone.addEventListener('keydown',e=>{const t=e.target;if(t.name==='title'&&t.form&&t.form.id==='addf'&&e.key==='Enter'){e.preventDefault();if(t.value.trim()){t.form.dataset.s1='1';addSteps(t.form);setTimeout(()=>t.form.querySelector('[name=project]').focus(),260)}}});
  zone.addEventListener('click',e=>{
    const q=s=>e.target.closest(s);let b;
    if(b=q('[data-cu]')){const f=b.closest('form');f.dataset.cst=f.dataset.cst==='1'?'0':'1';if(f.dataset.cst==='1'){const v=f.deadline.value;if(v===iso(day0())||v===addD(iso(day0()),1)){f.deadline.value='';dlSync(f)}}b.setAttribute('aria-pressed',f.dataset.cst);addSteps(f);return}
    if(b=q('[data-atb]')){const t=b.closest('.acust').querySelector('[data-atime]');t.hidden=false;b.hidden=true;t.focus();return}
    if(b=q('[data-done]')){const t=tasks.find(x=>x.id===b.dataset.done);if(t)move(t.id,lk(t)==='D'?LV[suggest(t)]:LV.D);return}
    if(b=q('[data-sug]')){const t=tasks.find(x=>x.id===b.dataset.sug);if(t)move(t.id,LV[suggest(t)]);return}
    if(b=q('[data-edit]')){editing=b.dataset.edit;confirmDel=null;render();view.querySelector('.edit [name=title]')?.focus();return}
    if(b=q('[data-dq]')){const f=b.closest('form'),d=day0();d.setDate(d.getDate()+(+b.dataset.dq));const v=iso(d);f.deadline.value=f.deadline.value===v?'':v;dlSync(f);return}
    if(b=q('.dlq .qdc')){const p=b.parentNode.querySelector('.dpp');p.hidden=!p.hidden;if(!p.hidden)p.querySelector('[data-dpd]').focus();return}
    if(b=q('[data-dpok]')){const f=b.closest('form'),p=b.closest('.dpp'),dv=p.querySelector('[data-dpd]').value,tv=p.querySelector('[data-dpt]').value;
      if(dv)f.deadline.value=tv?dv+'T'+tv:dv;p.hidden=true;dlSync(f);return}
    if(q('[data-cancel]')){editing=null;confirmDel=null;render();return}
    if(b=q('[data-del]')){const id=b.dataset.del;
      if(confirmDel!==id){confirmDel=id;render();return}
      const i=tasks.findIndex(x=>x.id===id),t=tasks[i];editing=null;confirmDel=null;tasks.splice(i,1);render();
      api('DELETE',{id}).then(()=>toast(L().deleted)).catch(er=>{tasks.splice(i,0,t);render();toast(L().fail(er.message))});return}
    if(q('[data-rat]')){ui.ratP=ui.ratP==='month'?'week':'month';save();render();return}
    if(b=q('[data-tog]')){const k=b.dataset.tog,sec=b.closest('.lane');ui.closed[k]=!ui.closed[k];save();if(sec&&!(k==='D'&&qf==='done')){sec.classList.toggle('shut',!!ui.closed[k]);b.setAttribute('aria-expanded',String(!ui.closed[k]))}else render();if(k==='D'&&!ui.closed.D)setTimeout(()=>rcolTo('#donew'),380);return}
    if(q('[data-tlt]')){ui.tlOpen=!ui.tlOpen;save();const tl=$('#tl');if(tl){tl.classList.toggle('shut',!ui.tlOpen);q('[data-tlt]').setAttribute('aria-expanded',String(ui.tlOpen))}else render();if(ui.tlOpen)setTimeout(()=>rcolTo('#tl'),400);return}
    if(b=q('[data-sc]')){ui.tlScale=b.dataset.sc;tlOff=0;save();render();return}
    if(b=q('[data-tlo]')){tlOff=+b.dataset.tlo?tlOff+(+b.dataset.tlo):0;render();return}
    if((b=q('.tt[data-tr]'))&&!q('.tbar')&&!tlDrag){const t=tasks.find(x=>x.id===b.dataset.tr);if(!t)return;
      const [a,n]=tlRange(),r=b.getBoundingClientRect(),i=Math.min(n-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*n))),d=addD(a,i);
      patch(t,{start:d,deadline:t.deadline||d},{start:d,deadline:t.deadline||d});return}
  });
  /* drag a bar: body moves both dates, the ends move start or deadline; snaps to whole days */
  let tlDrag=null;
  zone.addEventListener('pointerdown',e=>{
    const bar=e.target.closest('.tbar');if(!bar||e.button>0)return;const t=tasks.find(x=>x.id===bar.dataset.tb),sp=t&&span(t);if(!sp)return;
    const tr=bar.parentNode,[a,n]=tlRange();
    tlDrag={t,bar,a,n,w:tr.getBoundingClientRect().width/n,x:e.clientX,mode:e.target.dataset.h||'m',s0:sp.s,e0:sp.e,s:sp.s,e:sp.e,moved:false};
    bar.setPointerCapture(e.pointerId);bar.classList.add('drag');e.preventDefault();
  });
  zone.addEventListener('pointermove',e=>{
    const D=tlDrag;if(!D)return;const k=Math.round((e.clientX-D.x)/D.w);if(k)D.moved=true;
    let s1=D.s0,e1=D.e0;if(D.mode==='m'){s1=addD(D.s0,k);e1=addD(D.e0,k)}else if(D.mode==='s'){s1=addD(D.s0,k);if(s1>e1)s1=e1}else{e1=addD(D.e0,k);if(e1<s1)e1=s1}
    D.s=s1;D.e=e1;const i0=Math.max(0,diffD(D.a,s1)),i1=Math.min(D.n-1,diffD(D.a,e1));
    D.bar.style.left=i0*100/D.n+'%';D.bar.style.width=Math.max(0,i1-i0+1)*100/D.n+'%';D.bar.querySelector('.bt').textContent=dm(s1)+(s1!==e1?' → '+dm(e1):'');
  });
  const endDrag=()=>{const D=tlDrag;if(!D)return;setTimeout(()=>{tlDrag=null},0);D.bar.classList.remove('drag');
    if(D.moved&&(D.s!==D.s0||D.e!==D.e0||D.t.start!==D.s)){const tm=hasT(D.t.deadline)?D.t.deadline.slice(10):'',de=D.e+tm;patch(D.t,{start:D.s,deadline:de},{start:D.s,deadline:de}).then(()=>toast(L().savedN))}else render()};
  zone.addEventListener('pointerup',endDrag);zone.addEventListener('pointercancel',endDrag);
  zone.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const d=e.target.dataset||{};
    if(d.tog){e.preventDefault();ui.closed[d.tog]=!ui.closed[d.tog];save();render()}else if('tlt' in d){e.preventDefault();e.target.click()}});
  zone.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')});
  zone.addEventListener('dragend',e=>{e.target.closest('.card')?.classList.remove('drag');clearMark()});
  /* drag & drop: the drop position inside a lane is the task's priority; orders are rewritten 10, 20, 30… */
  const clearMark=()=>{$$('.lane.over').forEach(x=>x.classList.remove('over'));$$('.card.dbefore').forEach(x=>x.classList.remove('dbefore'));$$('.list.dend').forEach(x=>x.classList.remove('dend'))};
  function dropTarget(l,y){const cs=[...l.querySelectorAll('.list>.card:not(.drag)')];return cs.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2})||null}
  zone.addEventListener('dragover',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();clearMark();l.classList.add('over');
    const c=dropTarget(l,e.clientY);if(c)c.classList.add('dbefore');else l.querySelector('.list')?.classList.add('dend')});
  zone.addEventListener('dragleave',e=>{const l=e.target.closest('.lane');if(l&&!l.contains(e.relatedTarget))clearMark()});
  zone.addEventListener('drop',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();const before=dropTarget(l,e.clientY);clearMark();
    const id=e.dataTransfer.getData('text/plain'),t=tasks.find(x=>x.id===id);if(!t)return;const lvN=l.dataset.l,k=KEY[lvN];
    const ids=by(k).map(x=>x.id).filter(x=>x!==id);let i=before?ids.indexOf(before.dataset.id):ids.length;if(i<0)i=ids.length;ids.splice(i,0,id);
    const jobs=[];ids.forEach((x,j)=>{const tk=tasks.find(y=>y.id===x),o=(j+1)*10;
      if(x===id){if(tk.level!==lvN)jobs.push([tk,{order:o,level:lvN,prevLevel:tk.level,currentRepeat:tk.repeat},{order:o,level:lvN}]);else if(tk.order!==o)jobs.push([tk,{order:o},{order:o}])}
      else if(tk.order!==o)jobs.push([tk,{order:o},{order:o}])});
    jobs.forEach(([tk,b,o])=>patch(tk,b,o))});

  applyUi();pnScramble();render();load();tick();setInterval(tick,1000);
  setInterval(()=>{if(pass&&!document.hidden&&!editing&&!adding)load()},5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pass&&!editing)load()});
})();
