/* Layout: fixed V94 header (view icons · DARK · FX | page name + symbol | version · EN/VI · menu dot) → big digital
   countdown to the next deadline → stats → 4 priority lanes P1–P4 + collapsible Done column → tracking map →
   fixed footer (date/time stacked under the view icons). Behind: solid + image background, scan grid, heatwave.
   The red dot opens the CUSTOM panel: mica sliders on top, Save/Load/Reset/Import bar, sections on the left. */
:root{
  --bg:#16171c; --th:#e5322d; --pn-c:#ff97de; --hwc:#e5322d; --pbase:#18181e; --mo:.82; --mb:26px; --ms:1.3; --dgc:#ff5f6d; --dot:#e5322d; --scan:#22d3ee;
  --tx:#f2f2f4; --mut:#9a9aa8; --ln:rgba(255,255,255,.14); --ln2:rgba(255,255,255,.18);
  --sf:rgba(255,255,255,.05); --sf2:rgba(255,255,255,.045); --inp:rgba(0,0,0,.3); --hdbg:rgba(22,23,28,.55); --pbg:rgba(24,24,30,.82);
  --p1:#f0705a; --p2:#f0b04a; --p3:#6fb0e8; --p4:#a7adb0; --ok:#7cc98c; --pu:#b69cf2; --rem:#e6d25a; --link:#22d3ee;
  --hh:84px;
  --hfont:"Helvetica Black Extended","Helvetica Neue Black Extended","Helvetica Neue",Helvetica,"Arial Black",Arial,sans-serif;
  --ui:"Chakra Petch","Be Vietnam Pro",system-ui,sans-serif; --pop:"Poppins","Be Vietnam Pro",system-ui,sans-serif; --rt:rgba(255,255,255,.18); --rfi:#d6d6dc;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  color-scheme:dark;
}
/* light mode: macOS-style greys, not white */
:root[data-mode=light]{
  --pbase:#eeeef2; --rt:rgba(0,0,0,.2); --rfi:#3a3a42;
  --bg:#d3d3d9; --tx:#1d1d1f; --mut:#62626b; --ln:rgba(0,0,0,.1); --ln2:rgba(0,0,0,.14);
  --sf:rgba(255,255,255,.28); --sf2:rgba(255,255,255,.4); --inp:rgba(255,255,255,.5); --hdbg:rgba(214,214,220,.65); --pbg:rgba(222,222,228,.88);
  --p1:#d0432c; --p2:#b5760f; --p3:#2c6cae; --p4:#6b7076; --ok:#2e8645; --pu:#6f4dbf; --rem:#8f7400; --link:#0a6fb8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--th);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- background layers ---------- */
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#fx .rgs{position:absolute;inset:0;opacity:var(--ri,.7);}
#fx{display:block}body:not(.scan) #fx::before{display:none}
#fx::before{content:"";position:absolute;inset:0;opacity:var(--fxo,.8);
  background:linear-gradient(color-mix(in srgb,var(--scan) 22%,transparent) 1px,transparent 1px) calc(50% + var(--gs,52px)/2) calc(50% + var(--gs,52px)/2)/var(--gs,52px) var(--gs,52px),
    linear-gradient(90deg,color-mix(in srgb,var(--scan) 22%,transparent) 1px,transparent 1px) calc(50% + var(--gs,52px)/2) calc(50% + var(--gs,52px)/2)/var(--gs,52px) var(--gs,52px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 4px);
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 85%);mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 85%)}
#fx .rg{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%);border-radius:50%;
  border:var(--rw,1.5px) solid color-mix(in srgb,var(--rgc) 60%,transparent);box-shadow:0 0 var(--rb,20px) color-mix(in srgb,var(--rgc) 30%,transparent),inset 0 0 var(--rb,20px) color-mix(in srgb,var(--rgc) 18%,transparent);
  opacity:var(--ro,1);animation:ring var(--sws,30s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes ring{0%{width:0;height:0}100%{width:240vmax;height:240vmax}}
@keyframes ringo{0%{opacity:1}100%{opacity:var(--rend,0)}}
#fx.nosweep .rg{display:none}
#fx4{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none;transition:opacity 1s ease}#fx4.on{display:block}body.ldg #fx4{opacity:0;transition:none}html.cpo #fx4{left:min(380px,100vw)}
/* duo dots: pairs of dots on the left and right edges of the invisible rectangle around the 4 boards (placed by placeDuo) */
#fx4 b{position:absolute;z-index:0;background:var(--ln2)}#fx4 b.v{width:1px;margin-left:-.5px}#fx4 b.h{height:1px;margin-top:-.5px}
#fx4 i{position:absolute;z-index:1;left:0;top:0;width:var(--d4s,6px);height:var(--d4s,6px);background:var(--d4c,#22d3ee);opacity:calc(.65*var(--fxo,.8)/.8);border-radius:var(--d4r,0);transform:translate(-50%,-50%)}

#fx.dots::before{background:var(--dimg) calc(50% + var(--gs,52px)/2 - var(--ds,3px)/2) calc(50% + var(--gs,52px)/2 - var(--ds,3px)/2)/var(--gs,52px) var(--gs,52px)}

/* ---------- header (V94: 43px, 8px 14px, blur 30 / sat 1.4) ---------- */
html,body{min-height:100%}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
#hd{position:relative;z-index:30;width:100%;max-width:1280px;margin:0 auto;min-height:var(--hh);

    if('pick' in d){const i=f[e.target.name+'_new'];i.hidden=e.target.value!=='__new';if(!i.hidden)i.focus()}
    if(e.target.name==='repon'){f.repeat.disabled=!e.target.checked;if(f.repn)f.repn.disabled=!e.target.checked}
    if(e.target.name==='repeat'&&f.repn){f.querySelector('.rpc').hidden=e.target.value!=='custom'}});
  ['click','change','input'].forEach(ev=>zone.addEventListener(ev,e=>{const f=e.target.closest&&e.target.closest('#addf');if(f)setTimeout(()=>addSteps(f),0)}));
  zone.addEventListener('keydown',e=>{const t=e.target;if(t.name==='title'&&t.form&&t.form.id==='addf'&&e.key==='Enter'){e.preventDefault();if(t.value.trim()){t.form.dataset.s1='1';addSteps(t.form);setTimeout(()=>t.form.querySelector('[name=project]').focus(),260)}}});
  /* time wheels: hours 0–12 (+ AM/PM) and minutes 0–59; plain bounded lists, they do not loop */
  const TP=(()=>{const el=document.createElement('div');el.id='tpk';el.hidden=true;
    const col=(k,vals)=>`<div class="tcol" data-c="${k}"><i class="tpad"></i>${vals.map((v,i)=>`<b data-i="${i}">${v}</b>`).join('')}<i class="tpad"></i></div>`;
    el.innerHTML=`<div class="tcols"><span class="tsel"></span>${col('h',Array.from({length:13},(_,i)=>i))}${col('m',Array.from({length:60},(_,i)=>String(i).padStart(2,'0')))}${col('p',['AM','PM'])}</div><div class="tact"><button type="button" data-tclr></button><button type="button" class="btn pri" data-tok>OK</button></div>`;
    document.body.appendChild(el);return el})();
  let tpIn=null,tpBtn=null;const TH=32;
  const tpCols=()=>[...TP.querySelectorAll('.tcol')];
  const tpIdx=c=>Math.max(0,Math.min(c.querySelectorAll('b').length-1,Math.round(c.scrollTop/TH)));
  function tpMark(c){const i=tpIdx(c);c.querySelectorAll('b').forEach((x,k)=>x.classList.toggle('on',k===i))}
  function tpSet(v){let hh=9,mm=0;const m=/^(\d{1,2}):(\d{2})/.exec(v||'');if(m){hh=+m[1];mm=+m[2]}
    const pm=hh>=12,h=pm?(hh===12?12:hh-12):hh,cs=tpCols();[h,mm,pm?1:0].forEach((i,k)=>{cs[k].scrollTop=i*TH;tpMark(cs[k])})}
  function tpGet(){const cs=tpCols(),h=tpIdx(cs[0]),m=tpIdx(cs[1]),pm=tpIdx(cs[2]);return String((h%12)+(pm?12:0)).padStart(2,'0')+':'+String(m).padStart(2,'0')}
  function openTime(inp,anchor){tpIn=inp;tpBtn=anchor;TP.querySelector('[data-tclr]').textContent=L().tpClr;TP.hidden=false;
    const r=anchor.getBoundingClientRect(),w=TP.offsetWidth,h=TP.offsetHeight;TP.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';TP.style.top=(r.bottom+6+h>innerHeight?Math.max(8,r.top-h-6):r.bottom+6)+'px';tpSet(inp.value)}
  function closeTime(){TP.hidden=true;tpIn=null;tpBtn=null}
  function tpApply(v){if(!tpIn)return;tpIn.value=v;const sp=tpBtn&&tpBtn.querySelector&&tpBtn.classList.contains('tmb')?tpBtn.querySelector('span'):null;if(sp)sp.textContent=v||'--:--';
    ['input','change'].forEach(ev=>tpIn.dispatchEvent(new Event(ev,{bubbles:true})));closeTime()}
  TP.addEventListener('scroll',e=>{const c=e.target;if(c.classList&&c.classList.contains('tcol'))tpMark(c)},true);
  TP.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('b');if(b){const c=b.parentNode;c.scrollTo({top:(+b.dataset.i)*TH,behavior:'smooth'});return}
    if(e.target.closest('[data-tok]')){tpApply(tpGet());return}if(e.target.closest('[data-tclr]'))tpApply('')});
  document.addEventListener('click',e=>{if(!TP.hidden&&!TP.contains(e.target)&&!(tpBtn&&tpBtn.contains(e.target)))closeTime()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!TP.hidden)closeTime()});
  /* duplicate a card: same fields, a fresh copy (a finished card comes back as open), opened in edit mode */
  function dupCard(t){const d={title:t.title+L().copySfx,level:lk(t)==='D'?LV[suggest(t)]:t.level,project:t.project||'',type:t.type||'',size:t.size||'S',start:t.start||'',deadline:t.deadline||'',remind:t.remind||'',repeat:t.repeat||'',note:t.note||'',subs:subS(subP(t.subs).map(x=>({t:x.t,d:false}))),thumb:t.thumb||''};
    api('POST',d).then(j=>{tasks.push(j.task);editing=j.task.id;confirmDel=null;render();toast(L().dupDone);const i=$('#view .edit [name=title]');if(i){i.focus();i.select()}}).catch(e=>toast(L().fail(e.message)))}
  zone.addEventListener('click',e=>{
    const q=s=>e.target.closest(s);let b;
    if(b=q('[data-cu]')){const f=b.closest('form');f.dataset.cst=f.dataset.cst==='1'?'0':'1';if(f.dataset.cst==='1'){const v=f.deadline.value;if(v===iso(day0())||v===addD(iso(day0()),1)){f.deadline.value='';dlSync(f)}}b.setAttribute('aria-pressed',f.dataset.cst);addSteps(f);return}
    if(b=q('[data-atb]')){openTime(b.closest('.acust').querySelector('[data-atime]'),b);return}
    if(b=q('[data-dpt]')){openTime(b,b);return}
    if(b=q('[data-sub]')){const t=tasks.find(x=>x.id===(q('.card')||{dataset:{}}).dataset.id);if(t){const a=subP(t.subs);a[+b.dataset.sub].d=b.checked;patch(t,{subs:subS(a)},{subs:subS(a)})}return}
    if(b=q('.lpb')){b.closest('.lpk').classList.toggle('open');return}
    if(b=q('[data-lq]')){const t=tasks.find(x=>x.id===b.closest('.card').dataset.id);if(t){const d=day0();d.setDate(d.getDate()+(+b.dataset.lq));pushDue(t,iso(d))}return}
    if(b=q('[data-lqc]')){const i=b.parentNode.querySelector('[data-lqd]');try{i.showPicker()}catch(e){i.focus();i.click()}return}
    if(b=q('[data-rep]')){const t=tasks.find(x=>x.id===b.dataset.rep);if(t){const p=PER(t.repeat),T=iso(day0());let d=t.deadline.slice(0,10),n=0;const tm=t.deadline.slice(10);
      while((d<T||new Date(tm&&tm.length>1?d+tm:d+'T23:59:59')<new Date())&&n<999){if(t.repeat==='Hằng tháng'){const x=pd(d);x.setMonth(x.getMonth()+1);d=iso(x)}else d=addD(d,p);n++}
      const dl=diffD(t.deadline.slice(0,10),d),body={deadline:d+tm,moves:t.moves||0};if(t.start)body.start=addD(t.start.slice(0,10),dl)+t.start.slice(10);patch(t,body,body).then(()=>toast(L().repDone(dm(d))))}return}
    if(b=q('[data-focus]')){toggleFocus(b.dataset.focus);return}
    if(b=q('[data-dup]')){const t=tasks.find(x=>x.id===b.dataset.dup);if(t)dupCard(t);return}
    if(b=q('[data-done]')){const t=tasks.find(x=>x.id===b.dataset.done);if(t)move(t.id,lk(t)==='D'?LV[suggest(t)]:LV.D);return}
    if(b=q('[data-sug]')){const t=tasks.find(x=>x.id===b.dataset.sug);if(t)move(t.id,LV[suggest(t)]);return}
    if(b=q('[data-edit]')){editing=b.dataset.edit;confirmDel=null;render();view.querySelector('.edit [name=title]')?.focus();return}
    if(b=q('[data-dq]')){const f=b.closest('form'),d=day0();d.setDate(d.getDate()+(+b.dataset.dq));const v=iso(d);f.deadline.value=f.deadline.value===v?'':v;dlSync(f);return}
    if(b=q('.dlq .qdc')){const p=b.parentNode.querySelector('.dpp');p.hidden=!p.hidden;if(!p.hidden)p.querySelector('[data-dpd]').focus();return}
    if(b=q('[data-dpok]')){const f=b.closest('form'),p=b.closest('.dpp'),dv=p.querySelector('[data-dpd]').value,tv=p.querySelector('[data-dpt]').value;
      if(dv)f.deadline.value=tv?dv+'T'+tv:dv;p.hidden=true;dlSync(f);return}
    if(q('[data-cancel]')){editing=null;confirmDel=null;render();return}
    if(b=q('[data-del]')){const id=b.dataset.del;
      if(confirmDel!==id){confirmDel=id;render();return}
      const i=tasks.findIndex(x=>x.id===id),t=tasks[i];editing=null;confirmDel=null;tasks.splice(i,1);render();
      api('DELETE',{id}).then(()=>toast(L().deleted)).catch(er=>{tasks.splice(i,0,t);render();toast(L().fail(er.message))});return}
    if(q('[data-rat]')){ui.ratP=ui.ratP==='month'?'week':'month';save();render();return}
    if(b=q('[data-lx]')){lx=lx===b.dataset.lx?'':b.dataset.lx;render();return}
    if(b=q('[data-tog]')){const k=b.dataset.tog,sec=b.closest('.lane');ui.closed[k]=!ui.closed[k];save();if(sec&&!(k==='D'&&qf==='done')){sec.classList.toggle('shut',!!ui.closed[k]);b.setAttribute('aria-expanded',String(!ui.closed[k]))}else render();if(k==='D'&&!ui.closed.D)setTimeout(()=>rcolTo('#donew'),380);return}
    if(q('[data-tlt]')||(q('.tlh')&&!q('button,select,input,.seg,[data-tnr]'))){ui.tlOpen=!ui.tlOpen;save();const tl=$('#tl');if(tl){tl.classList.toggle('shut',!ui.tlOpen);$('[data-tlt]').setAttribute('aria-expanded',String(ui.tlOpen))}else render();if(ui.tlOpen)setTimeout(()=>rcolTo('#tl'),400);return}
    if(b=q('[data-sc]')){ui.tlScale=b.dataset.sc;tlOff=0;save();render();return}
    if(b=q('[data-tlo]')){tlOff=+b.dataset.tlo?tlOff+(+b.dataset.tlo):0;render();return}
    if((b=q('.tt[data-tr]'))&&!q('.tbar')&&!tlDrag){const t=tasks.find(x=>x.id===b.dataset.tr);if(!t)return;
      const [a,n]=tlRange(),r=b.getBoundingClientRect(),i=Math.min(n-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*n))),d=addD(a,i);
      patch(t,{start:d,deadline:t.deadline||d},{start:d,deadline:t.deadline||d});return}
  });
  /* drag a bar: body moves both dates, the ends move start or deadline; snaps to whole days */
  let tlDrag=null;
  zone.addEventListener('pointerdown',e=>{
    const bar=e.target.closest('.tbar');if(!bar||e.button>0)return;const t=tasks.find(x=>x.id===bar.dataset.tb),sp=t&&span(t);if(!sp)return;
    const tr=bar.parentNode,[a,n]=tlRange();
    tlDrag={t,bar,a,n,w:tr.getBoundingClientRect().width/n,x:e.clientX,mode:e.target.dataset.h||'m',s0:sp.s,e0:sp.e,s:sp.s,e:sp.e,moved:false};
    bar.setPointerCapture(e.pointerId);bar.classList.add('drag');e.preventDefault();
  });
  zone.addEventListener('pointermove',e=>{
    const D=tlDrag;if(!D)return;const k=Math.round((e.clientX-D.x)/D.w);if(k)D.moved=true;
    let s1=D.s0,e1=D.e0;if(D.mode==='m'){s1=addD(D.s0,k);e1=addD(D.e0,k)}else if(D.mode==='s'){s1=addD(D.s0,k);if(s1>e1)s1=e1}else{e1=addD(D.e0,k);if(e1<s1)e1=s1}
    D.s=s1;D.e=e1;const i0=Math.max(0,diffD(D.a,s1)),i1=Math.min(D.n-1,diffD(D.a,e1));
    D.bar.style.left=i0*100/D.n+'%';D.bar.style.width=Math.max(0,i1-i0+1)*100/D.n+'%';D.bar.querySelector('.bt').textContent=dm(s1)+(s1!==e1?' → '+dm(e1):'');
  });
  const endDrag=()=>{const D=tlDrag;if(!D)return;setTimeout(()=>{tlDrag=null},0);D.bar.classList.remove('drag');
    if(D.moved&&(D.s!==D.s0||D.e!==D.e0||D.t.start!==D.s)){const tm=hasT(D.t.deadline)?D.t.deadline.slice(10):'',de=D.e+tm;patch(D.t,{start:D.s,deadline:de},{start:D.s,deadline:de}).then(()=>toast(L().savedN))}else render()};
  zone.addEventListener('pointerup',endDrag);zone.addEventListener('pointercancel',endDrag);
  zone.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const d=e.target.dataset||{};
    if(d.tog){e.preventDefault();ui.closed[d.tog]=!ui.closed[d.tog];save();render()}else if('tlt' in d){e.preventDefault();e.target.click()}});
  zone.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')});
  zone.addEventListener('dragend',e=>{e.target.closest('.card')?.classList.remove('drag');clearMark()});
  /* drag & drop: the drop position inside a lane is the task's priority; orders are rewritten 10, 20, 30… */
  const clearMark=()=>{$$('.lane.over').forEach(x=>x.classList.remove('over'));$$('.card.dbefore').forEach(x=>x.classList.remove('dbefore'));$$('.list.dend').forEach(x=>x.classList.remove('dend'))};
  function dropTarget(l,y){const cs=[...l.querySelectorAll('.list>.card:not(.drag)')];return cs.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2})||null}
  zone.addEventListener('dragover',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();clearMark();l.classList.add('over');
    const c=dropTarget(l,e.clientY);if(c)c.classList.add('dbefore');else l.querySelector('.list')?.classList.add('dend')});
  zone.addEventListener('dragleave',e=>{const l=e.target.closest('.lane');if(l&&!l.contains(e.relatedTarget))clearMark()});
  zone.addEventListener('drop',e=>{const l=e.target.closest('.lane');if(!l)return;e.preventDefault();const before=dropTarget(l,e.clientY);clearMark();
    const id=e.dataTransfer.getData('text/plain'),t=tasks.find(x=>x.id===id);if(!t)return;const lvN=l.dataset.l,k=KEY[lvN];
    const ids=by(k).map(x=>x.id).filter(x=>x!==id);let i=before?ids.indexOf(before.dataset.id):ids.length;if(i<0)i=ids.length;ids.splice(i,0,id);
    const jobs=[];ids.forEach((x,j)=>{const tk=tasks.find(y=>y.id===x),o=(j+1)*10;
      if(x===id){if(tk.level!==lvN)jobs.push([tk,{order:o,level:lvN,prevLevel:tk.level,currentRepeat:tk.repeat},{order:o,level:lvN}]);else if(tk.order!==o)jobs.push([tk,{order:o},{order:o}])}
      else if(tk.order!==o)jobs.push([tk,{order:o},{order:o}])});
    jobs.forEach(([tk,b,o])=>patch(tk,b,o))});

  function placeTop(){const rt=$('#rtop'),hr=$('#hd .hr'),m=$('#modeB'),f=$('#fxB'),fc=$('#fcB'),ly=$('#lyN'),g=$('#gAv');if(!rt||!hr)return;
    if(innerWidth>760){if(m.parentNode!==rt)rt.append(m,f,ly,g)}else if(m.parentNode===rt){hr.insertBefore(m,fc);hr.appendChild(f);document.body.append(ly,g)}}
  placeTop();addEventListener('resize',placeTop);
  applyUi();pnScramble();render();load();tick();setInterval(tick,1000);
  setInterval(()=>{if(pass&&!document.hidden&&!editing&&!adding)load()},5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pass&&!editing)load()});
})();
</script>
